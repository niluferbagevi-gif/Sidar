[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidar"
version = "5.2.0"
description = "Sidar AI: Multi-Agent Autonomous System with Swarm Capability"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Nilüfer Bagevi", email = "niluferbagevi@users.noreply.github.com"},
]
keywords = ["ai", "agent", "swarm", "code-generation", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # NOTE: Bu liste production-minimal profile geçişinin Faz 1 runtime yüzeyidir.
  # Dev/test araçları `dev` extra altında tutulur; repo standardı local/CI paritesi
  # için hâlâ `uv sync --all-extras` komutudur. Production-minimal ayrıştırma
  # docs/DEPENDENCY_PROFILE_PLAN.md ve [tool.sidar.dependency_profile_plan]
  # ile takip edilir.
  # ── Temel altyapı ──────────────────────────────────────────────────────
  "packaging~=24.1",
  "python-dotenv==1.2.2",
  "pyyaml~=6.0.2",
  # HTTP client policy: production imports use httpx only; the old httpx2
  # migration candidate was retired to keep the runtime dependency graph smaller.
  "httpx>=0.27.0,<0.29.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.14.2,<3.0.0",
  "cachetools~=5.5.0",
  "redis~=5.2.1",
  "psutil~=6.0.0",
  # ── Web sunucu ─────────────────────────────────────────────────────────
  "fastapi>=0.136.1,<0.140.0",
  # Starlette 1.3.1+ includes fixes for current request parsing and URL validation CVEs.
  "starlette>=1.3.1,<1.4.0",
  "python-multipart>=0.0.31,<0.1.0",
  "uvicorn[standard]~=0.30.6",
  "anyio>=4.0.0",
  # ── Veritabanı ─────────────────────────────────────────────────────────
  "aiosqlite~=0.20.0",
  "SQLAlchemy~=2.0.36",
  "alembic~=1.14.0",
  # ── Güvenlik / Kimlik doğrulama ────────────────────────────────────────
  "cryptography>=46.0.6",
  "argon2-cffi>=25.1.0,<26.0.0",
  "PyJWT>=2.12.0",
  # Pin transitive pyasn1 above CVE-2026-59885/CVE-2026-59886 fix (google-auth ->
  # pyasn1-modules -> pyasn1); needed until google-auth upstream tightens its own floor.
  "pyasn1>=0.6.4",
  # ── HTTP istemcisi ─────────────────────────────────────────────────────
  "requests>=2.32.5",
  "tenacity>=8.0.0,<10.0.0",
  # ── İçerik işleme ─────────────────────────────────────────────────────
  "tiktoken~=0.12.0",
  "rank-bm25==0.2.2",
  "beautifulsoup4~=4.12.3",
  "bleach>=6.4.0,<7.0.0",
  # Keep NeMo Guardrails on the validated 0.22 minor until the SecurityManager
  # adapter contract is re-run against a newer major/minor API.
  "nemoguardrails>=0.22.0,<0.23.0",
  # ── Harici entegrasyonlar ─────────────────────────────────────────────
  "PyGithub~=2.4.0",
  "duckduckgo-search~=6.2.13",
  "websockets>=15.0,<16.0",
  "pillow>=12.2.0,<14.0.0",
  "pyttsx3~=2.98",
  "chromadb~=0.5.5",
  "langchain-core>=1.0.0,<2.0.0",
  "langchain-community>=0.3.0,<2.0.0",
  "langchain-text-splitters>=1.1.2,<2.0.0",
  # Pin transitive langsmith above GHSA-f4xh-w4cj-qxq8 fix; needed until
  # langchain-* upstream tightens its own floor on langsmith.
  "langsmith>=0.8.18,<1.0.0",
  # ChromaDB 0.5.x brings PostHog as its telemetry client; keep it on the
  # current 5.x API until the Chroma/RAG telemetry smoke matrix validates v6.
  "posthog<6.0.0",
  "sentence-transformers>=3.0.1,<6.0.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]

[project.urls]
Repository = "https://github.com/niluferbagevi-gif/Sidar"
Documentation = "https://github.com/niluferbagevi-gif/Sidar/tree/main/docs"
Changelog = "https://github.com/niluferbagevi-gif/Sidar/blob/main/CHANGELOG.md"
Issues = "https://github.com/niluferbagevi-gif/Sidar/issues"

[project.scripts]
sidar = "cli:main"
sidar-gui = "gui_launcher:main"
sidar-web = "web_server:main"

[project.optional-dependencies]
# ── LLM sağlayıcıları (istenilen sağlayıcı için ilgili extras ekleyin) ──
gemini = [
  "google-genai>=1.0.0,<2.0.0",
]
anthropic = [
  "anthropic~=0.40.0",
]
openai = [
  "openai>=2.8.0,<3.0.0",
]
litellm = [
  "litellm>=1.83.7,<2.0.0",
]

# ── Altyapı extras ────────────────────────────────────────────────────────
postgres = [
  "asyncpg~=0.30.0",
  "psycopg2-binary~=2.9.10",
  "pgvector~=0.3.6",
]
telemetry = [
  "prometheus-client~=0.21.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]
rag = [
  "chromadb~=0.5.5",
  "posthog<6.0.0",
  # Keep torch below 2.12 while CVE-2025-3000 is tracked by security/pip-audit-ignores.tsv.
  # Current lock target is torch 2.11.0; re-check upstream patches by 2026-08-15
  # before the dated policy exception expires.
  "torch>=2.4.1,<2.12",
  "torchvision>=0.19,<0.27",
  "sentence-transformers>=3.0.1,<6.0.0",
]
lora = [
  "transformers>=5.0.0,<6.0.0",
  "peft>=0.12.0",
  "datasets>=2.20.0",
  "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
]
gpu = [
  "nvidia-ml-py~=12.560.30",
]
# Python Docker SDK for sandbox integrations. This does not install the
# system-level Docker CLI/daemon; use install_sidar.sh prepare-system or the
# Dev Container feature setup for docker/buildx/compose binaries.
sandbox = [
  "docker~=7.1.0",
]
gui = [
  "eel>=0.16.0",
]
slack = [
  "slack-sdk~=3.33.0",
]
browser = [
  "playwright>=1.60,<1.62",
  "selenium~=4.29.0",
]
voice = [
  "SpeechRecognition~=3.10.4",
  # PyAudio is intentionally not hidden behind a platform marker: failures are
  # usually missing PortAudio headers on otherwise supported developer hosts.
  # Run scripts/install_ci_system_deps.sh before uv sync to prepare them.
  "pyaudio~=0.2.14",
  "openai-whisper>=20231117",
]
tools = [
  "yt-dlp>=2024.0.0",
]
aws = [
  "boto3~=1.35.0",
]
jira = [
  "jira~=3.8.0",
]
teams = [
  "pymsteams~=0.2.3",
  "msal>=1.36.0,<2.0.0",
]

# ── Kolaylık profilleri ───────────────────────────────────────────────────
all = [
  "sidar[gemini,anthropic,openai,litellm,postgres,telemetry,rag,lora,gpu,sandbox,gui,slack,browser,voice,tools,aws,jira,teams,dev]",
]
# Fast PR/local profile with no system-header-dependent voice/browser/media extras.
# Use this when PortAudio/Playwright/GPU packages are irrelevant to the change.
dev-light = [
  "sidar[postgres,dev]",
]
dev-gpu = [
  "sidar[postgres,dev,rag,gpu]",
]
gpu-runtime = [
  "sidar[rag,gpu]",
]
production = [
  "sidar[postgres,telemetry]",
]
production-minimal = [
  "sidar[postgres]",
]
dev = [
  "sidar[postgres]",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.1",
  "freezegun>=1.5.1",
  "pytest-cov~=5.0.0",
  "pytest-benchmark~=4.0.0",
  "pytest-mock>=3.14.0",
  "hypothesis>=6.112.0",
  "respx>=0.21.1",
  "fakeredis>=2.20.0",
  "testcontainers>=4.0.0",
  "ruff>=0.15,<0.16",
  "mypy~=1.11.2",
  "pyright>=1.1.409,<2.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "shellcheck-py>=0.10.0.1,<0.11.0",
  "types-bleach>=6.4.0.20260607",
  "defusedxml>=0.7.1",
  "types-defusedxml",
  "types-requests",
  "types-PyYAML",
  "types-cachetools",
  "types-beautifulsoup4",
  "bandit>=1.7.0",
  "safety>=3.0.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]


