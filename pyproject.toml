[tool.sidar.dependency_profile_plan]
current_install_standard = "installer default developer-full; uv sync --all-extras"
installer_default_profile = "dev-full"
developer_full_sync = "uv sync --all-extras"
ci_full_sync = "uv sync --all-extras"
production_profile = "production"
production_minimal_profile = "production-minimal"
status = "phase-1-dev-split"
owner_doc = "docs/DEPENDENCY_PROFILE_PLAN.md"
preserve_all_extras_standard = true
planned_profile_groups = ["base", "web", "rag", "multimodal", "dev", "test", "gpu"]
requirements_exporter = "scripts/export_production_requirements.sh"
production_dockerfile = "Dockerfile.production"
summary = "Phase 1 moved dev/test quality tools out of the main runtime dependencies, declares distinct production (postgres+telemetry) and production-minimal (postgres-only) extras for web/API deploys, adds a requirements export helper, and provides a no-dev production Dockerfile while preserving uv sync --all-extras for development."

[tool.sidar.dependency_profile_plan.production_minimal_runtime_validation]
status = "release-blocking"
owner = "qa+release"
review_by = "2026-08-15"
required_command = "SIDAR_DEPENDENCY_PROFILE=production-minimal ./install_sidar.sh sync-deps --skip-models --skip-smoke-test --ci --no-interaction"
web_boot_smoke_command = "uv run --no-sync python -c \"from web.app_factory import create_app; app = create_app(register_handlers=False); assert '/docs' in [route.path for route in app.routes]\""
db_migration_smoke_command = "DATABASE_URL=sqlite+aiosqlite:///./artifacts/production-minimal/migration-smoke.db uv run --no-sync alembic upgrade head"
follow_up_gate = "TEST_PROFILE=ci RUN_BENCHMARKS=required RUN_FRONTEND_E2E=1 SIDAR_PRODUCTION_READINESS=1 bash run_tests.sh --stage all"
current_ci_job = "production-profile-dry-run"
release_artifact = "production-minimal-runtime-evidence"
release_artifact_path = "artifacts/production-minimal/runtime-evidence.json"
next_action = "Keep the production-minimal runtime validation job release-blocking and review evidence freshness by 2026-08-15."
blocking_transition_pr_required = false
summary = "production-minimal is now backed by a release-blocking CI gate that runs installer sync, web boot smoke, DB migration smoke, and uploads runtime evidence artifacts."

[tool.sidar.dependency_profile_plan.installer_profile_visibility]
default_profile = "dev-full"
default_command = "./install_sidar.sh --dev-full"
production_minimal_command = "./install_sidar.sh --production-minimal"
status = "visible-opt-in"
summary = "Installer now prompts/selects a dependency profile after runtime mode: dev-full is the normal recommended default via uv sync --all-extras, dev-light remains an opt-in fast local profile, dev-gpu/gpu-runtime cover narrow CUDA/RAG remediation, production-minimal/production cover runtime installs, and custom supports explicit provider extras."

[tool.sidar.dependency_profile_plan.torch_upgrade_reminder]
current_lock = "torch 2.11.0"
tracked_policy_exception = "CVE-2025-3000"
advisory_checked_on = "2026-07-16"
upstream_last_affected = "2.12.0"
upstream_patched_versions = "none"
review_by = "2026-08-15"
expires = "2026-09-15"
warning_window_days = 45
calendar_file = "docs/reminders/torch-cve-review-2026-08-15.ics"
runbook_file = "docs/runbooks/torch-cve-upgrade.md"
tracked_files = [
  "pyproject.toml",
  "security/pip-audit-ignores.tsv",
  "docs/runbooks/torch-cve-upgrade.md",
  "docs/DEPENDENCY_PROFILE_PLAN.md",
]
upgrade_command = "uv lock --upgrade-package torch --upgrade-package torchvision"
validation_commands = [
  "uv sync --all-extras",
  "uv run --with pip-audit pip-audit --skip-editable --timeout 30",
]

[tool.sidar.ruff_debt]
line_length = 100
close_docstring_campaign_by = "2026-09-30"
close_async240_campaign_by = "2026-09-30"
tracking_owner = "qa+reviewer"
planned_validation_commands = [
  "uv run ruff check . --select D,ASYNC",
  "uv run python scripts/ci/check_ruff_debt_baseline.py",
  "uv run ruff check .",
]
e501_global_ignore_review_by = "2026-09-30"
e501_global_ignore_reason = "Legacy root entrypoints still contain long lines; new or meaningfully edited code should wrap to line-length=100 and avoid expanding this debt."
e501_debt_baseline = 0
async240_global_ignore_review_by = "2026-09-30"
async240_global_ignore_reason = "Legacy async code paths still contain synchronous pathlib metadata checks that are safe for current small local files but trip Ruff ASYNC240 after flake8-async updates; new async I/O paths should prefer asyncio.to_thread, anyio.Path, or precomputed sync setup instead of expanding this debt."
legacy_hotspots = ["web_server.py", "main.py"]
docstring_async_debt_baseline = { D200 = 0, D202 = 0, D205 = 0, D209 = 0, D212 = 0, D403 = 0, D415 = 0, D417 = 0, ASYNC240 = 0 }

[[tool.sidar.dependency_profile_plan.profiles]]
name = "runtime"
intent = "Minimum library/runtime dependencies required by core Sidar imports."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "dev"
intent = "pytest, lint, type-check and security-audit tools used by local/CI gates."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "dev-light"
intent = "Fast PR/local profile: postgres + dev tools without voice/browser/GPU system dependencies."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "all"
intent = "Current complete developer experience; must keep uv sync --all-extras compatibility."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "production"
intent = "Web/API runtime plus postgres and telemetry extras; no pytest/ruff/mypy/bandit/safety once the split lands."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "production-minimal"
intent = "Postgres-only no-dev Web/API smoke surface used by the CI dry-run before telemetry is opted in via production."

[tool.bandit]
exclude_dirs = [
  ".git",
  ".venv",
  ".venv-container",
  "tests",
  "web_ui_react",
  "node_modules",
  "artifacts",
  "logs",
  "data",
]
skips = [
  "B101", # Assertions kullanımı
  "B404", # subprocess import uyarısı; B603/B607 çağrı bazında değerlendiriliyor
]
# B608 (dinamik SQL) global olarak skip edilmiyor: gerçek riskler satır bazlı
# `# nosec B608  # <gerekçe>` ile bastırılır (bkz. core/router.py, core/db/monolith.py,
# core/db/prompt_registry.py, core/rag/backends/pgvector.py, scripts/migrate_sqlite_to_pg.py).
# Global skip, yeni yazılacak kodda gerçek bir SQL injection riskini de sessizce
# gizleyebileceği için tercih edilmiyor.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "asyncio: run coroutine test",
  "slow: yavaş entegrasyon testleri (CI'da -m \"not slow\" ile atlanabilir)",
  "gpu: gerçek GPU donanımı gerektiren testler (CI ortamlarında atlanmalıdır)",
  "gpu_stress: uzun/yoğun GPU yük testleri (CI pipeline'ında ayrı job olarak çalıştırılabilir)",
  "pg_stress: PostgreSQL bağlantı havuzu yük testleri (postgres servisi gerektirir)",
  "benchmark: performans baseline testleri",
  "integration: harici sistem entegrasyonları",
  "quality_gate: deterministik kalite kapısı doğrulamaları",
  "shellcheck: shell betikleri için ShellCheck kalite kapısı",
  "installer_smoke: release-critical installer smoke tests",
  "allow_unit_network: explicit opt-out for rare unit tests that must exercise real sockets",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:setuptools",
  "ignore::FutureWarning:torch",
  "ignore::UserWarning:torch",
  "ignore::ResourceWarning",
  # Keep this as a message/module filter instead of importing the pydantic
  # warning class during pytest config parsing. If a developer has not run
  # `uv sync --all-extras` yet, pytest should reach tests/conftest.py and
  # emit the project's actionable missing-dependency message rather than
  # failing early while resolving this warning category.
  "ignore::DeprecationWarning:pydantic.*",
  "ignore:Field \"model_.*\" has conflict with protected namespace:UserWarning",
  "ignore:Benchmarks are automatically disabled because xdist plugin is active\\.Benchmarks cannot be performed reliably in a parallelized environment\\.:pytest_benchmark.logger.PytestBenchmarkWarning",
  # GitHub-hosted runners provision heterogeneous CPU models between the cached
  # baseline run and later PR runs, so this informational mismatch is expected
  # and must not crash benchmark-compare with an INTERNALERROR.
  "ignore:Benchmark machine_info is different\\..*:pytest_benchmark.logger.PytestBenchmarkWarning",
  "ignore:invalid escape sequence '\\\\g':DeprecationWarning:sentence_transformers.evaluation.SentenceEvaluator",
  "ignore:invalid escape sequence.*:DeprecationWarning:sentence_transformers.*",
  # httpx2 migration was deliberately retired (see dependencies comment in this
  # file); production and tests intentionally stay on httpx, so silence
  # starlette's testclient nudge instead of adding the extra dependency back.
  "ignore:Using .httpx. with .starlette\\.testclient. is deprecated; install .httpx2. instead\\.:starlette.exceptions.StarletteDeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
log_file = "tests/pytest.log"
log_file_level = "DEBUG"
addopts = "-ra"

[tool.coverage.run]
branch = true
parallel = true
source = ["."]
omit = [
  "*/plug_auto_discover*",
  "*/plug_bad_compile*",
  "conftest.py",
  "migrations/*",
  "temp/*",
  "*/third_party/*",
  "*/templates/*",
  "*:Zone.Identifier",
  "*/__pycache__/*",
  "*/site-packages/*",
  ".venv/*",
  "venv/*",
  ".tox/*",
  ".env",
  "setup.py",
  "web_ui_react/*",
  "tests/*",
]

[tool.coverage.report]
# Ratchet-managed quality gate baseline: current local/CI baseline is %99.
# scripts/coverage_ratchet.py only ever raises this committed value as measured
# coverage improves; daily local/CI profiles keep the default ratchet cap at %99
# unless an explicit strict profile is selected. run_tests.sh reads this
# pyproject-owned value for local/CI profiles and applies overrides only at the
# final combined report. The %100 coverage campaign remains opt-in via the
# campaign/strict profile, not this default gate.
fail_under = 99
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@abstractmethod",
  "@abstractproperty",
  "if 0:",
  "if False:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Sidar Test Coverage"
extra_css = "assets/dark_mode.css"

[tool.uv]
index-strategy = "first-index"
environments = ["sys_platform == 'linux'"]
override-dependencies = ["setuptools>=83.0.0"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "launcher*", "managers*", "plugins*", "sidar_assets*", "web*"]
exclude = ["tests*", "docs*", "scripts*", "data*", "logs*", "*.tests"]

[tool.setuptools]
include-package-data = true
py-modules = [
  "cli",
  "main",
  "web_server",
  "gui_launcher",
  "config",
  "config_autonomy",
  "config_gpu",
  "config_llm",
  "config_quality",
  "config_rag",
  "config_rag_defaults",
  "config_security",
  "scripts.version_probe",
  "sidar_version",
  "github_upload",
]


[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md", "*.sql", "*.css", "*.html", "*.js"]
sidar_assets = [
  "alembic.ini",
  "web_ui_react/dist/**/*",
  "helm/sidar/**/*",
  "migrations/**/*",
  "docker_setup/**/*",
]

[tool.setuptools.data-files]
"share/sidar/launcher_gui" = ["launcher_gui/*.html", "launcher_gui/*.css", "launcher_gui/*.js"]
"share/sidar/helm" = [
  "helm/sidar/Chart.yaml",
  "helm/sidar/*.yaml",
  "helm/sidar/templates/*.yaml",
  "helm/sidar/templates/*.tpl",
  "helm/sidar/templates/*.txt",
]
"share/sidar/migrations" = [
  "alembic.ini",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
]
"share/sidar/docker_setup" = [
  "docker_setup/prometheus/*.yml",
  "docker_setup/grafana/dashboards/*.json",
  "docker_setup/grafana/provisioning/dashboards/*.yml",
  "docker_setup/grafana/provisioning/datasources/*.yml",
]
"share/sidar/runbooks" = [
  "runbooks/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  ".venv-container",
  "__pycache__",
  "data",
  "logs",
  "migrations",
  "docker_setup",
  "build",
  "dist",
  "temp",
  "web_ui",
  "web_ui_react",
  "launcher_gui",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "ASYNC",
  "D",
]
ignore = [
  # E501 remains a temporary legacy compatibility ignore; see [tool.sidar.ruff_debt].
  "E501",
  # D100-D107 eksik docstring kuralları AGENTS.md §2.5.6'de tarihli kademeli
  # dokümantasyon kampanyasına bağlıdır; agent rol kontratları şimdilik
  # tests/unit/agent/test_builtin_role_contracts.py ile korunur.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  # D200-D417 stil ignore'ları aynı kampanyanın 2026-09-30 kapanış kapısında
  # kaldırılacaktır; yeni dokümantasyon Google convention'a uymalıdır.
  "D200",
  "D202",
  "D205",
  "D209",
  "D212",
  "D403",
  "D415",
  "D417",
  # ASYNC240 is tracked in [tool.sidar.ruff_debt]; new async I/O code should not
  # add blocking pathlib calls just because this compatibility ignore exists.
  "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Path",
  "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
files = [
  "agent",
  "core",
  "managers",
  "plugins",
  "web",
  "cli.py",
  "main.py",
  "web_server.py",
  "config.py",
  "sidar_version.py",
  "github_upload.py",
  "gui_launcher.py",
]
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
pretty = true
exclude = [
  "^tests/",
  "^data/",
  "^logs/",
  "^temp/",
  "^migrations/",
  "^build/",
  "^web_ui_react/",
  "^launcher_gui/",
  "^\\.venv/",
  "^sidar\\.egg-info/",
  "^\\.mypy_cache/",
]

[[tool.mypy.overrides]]
module = [
  "google.genai",
  "google.genai.*",
  "google.generativeai",
  "google.generativeai.*",
  "chromadb",
  "chromadb.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "duckduckgo_search",
  "duckduckgo_search.*",
  "github",
  "github.*",
  "opentelemetry",
  "opentelemetry.*",
  "redis",
  "redis.*",
  "prometheus_client",
  "prometheus_client.*",
  "asyncpg",
  "asyncpg.*",
  "pyttsx3",
  "pyttsx3.*",
  "psycopg2",
  "psycopg2.*",
  "torch",
  "torch.*",
  "pynvml",
  "pynvml.*",
  "docker",
  "docker.*",
  "eel",
  "eel.*",
  "datasets",
  "datasets.*",
  "peft",
  "peft.*",
  "transformers",
  "transformers.*",
  "tiktoken",
  "jira",
  "jira.*",
  "slack_sdk",
  "slack_sdk.*",
  "msal",
  "msal.*",
  "bs4",
  "bs4.*",
  "playwright",
  "playwright.*",
  "bleach",
  "bleach.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "playwright>=1.60,<1.62",
]
