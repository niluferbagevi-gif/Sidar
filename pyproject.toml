[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sidar"
version = "5.2.0"
description = "Sidar AI: Multi-Agent Autonomous System with Swarm Capability"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE*"]
requires-python = ">=3.11,<3.12"
authors = [
  {name = "Nilüfer Bagevi", email = "niluferbagevi@users.noreply.github.com"},
]
keywords = ["ai", "agent", "swarm", "code-generation", "rag"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  # NOTE: Bu liste şu anda legacy tam kurulum yüzeyidir; dev/test araçları da
  # burada tutulur çünkü repo standardı `uv sync --all-extras` ile local/CI
  # paritesini korumaktır. Production-minimal ayrıştırma için
  # docs/DEPENDENCY_PROFILE_PLAN.md ve [tool.sidar.dependency_profile_plan]
  # takip edilir; bu PR mevcut kurulum sözleşmesini değiştirmez.
  # ── Temel altyapı ──────────────────────────────────────────────────────
  "packaging~=24.1",
  "python-dotenv==1.2.2",
  "pyyaml~=6.0.2",
  "httpx>=0.27.0,<0.29.0",
  "pydantic>=2.8.2,<3.0.0",
  "pydantic-settings>=2.10.1,<3.0.0",
  "cachetools~=5.5.0",
  "redis~=5.2.1",
  "psutil~=6.0.0",
  # ── Web sunucu ─────────────────────────────────────────────────────────
  "fastapi>=0.136.1,<0.140.0",
  # Starlette 1.2+ TestClient requires the separate httpx2 package.
  "starlette>=1.0.1,<1.2.0",
  "python-multipart~=0.0.9",
  "uvicorn[standard]~=0.30.6",
  "anyio>=4.0.0",
  # ── Veritabanı ─────────────────────────────────────────────────────────
  "aiosqlite~=0.20.0",
  "SQLAlchemy~=2.0.36",
  "alembic~=1.14.0",
  # ── Güvenlik / Kimlik doğrulama ────────────────────────────────────────
  "cryptography>=46.0.6",
  "PyJWT>=2.12.0",
  # ── HTTP istemcisi ─────────────────────────────────────────────────────
  "requests>=2.32.5",
  "tenacity>=8.0.0,<10.0.0",
  # ── İçerik işleme ─────────────────────────────────────────────────────
  "tiktoken~=0.12.0",
  "rank-bm25==0.2.2",
  "beautifulsoup4~=4.12.3",
  "bleach~=6.1.0",
  "nemoguardrails>=0.13.0",
  # ── Harici entegrasyonlar ─────────────────────────────────────────────
  "PyGithub~=2.4.0",
  "duckduckgo-search~=6.2.13",
  "websockets<15.0",
  "pillow>=12.2.0,<14.0.0",
  "pyttsx3~=2.98",
  "chromadb~=0.5.5",
  "langchain-core>=1.0.0,<2.0.0",
  "langchain-community>=0.3.0,<2.0.0",
  "langchain-text-splitters>=1.1.2,<2.0.0",
  "posthog<6.0.0",
  "sentence-transformers>=3.0.1,<6.0.0",
  # ── Geliştirme/test kalite araçları (standart kurulum akışında zorunlu) ──
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.1",
  "freezegun>=1.5.1",
  "pytest-cov~=5.0.0",
  "pytest-benchmark~=4.0.0",
  "pytest-mock>=3.14.0",
  "hypothesis>=6.112.0",
  "respx>=0.21.1",
  "fakeredis>=2.20.0",
  "testcontainers>=4.0.0",
  "ruff~=0.8.1",
  "mypy~=1.11.2",
  "pyright>=1.1.409,<2.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "shellcheck-py>=0.10.0.1,<0.11.0",
  "types-bleach>=6.1.0.20240311",
  "defusedxml>=0.7.1",
  "types-defusedxml",
  "types-requests",
  "types-PyYAML",
  "types-cachetools",
  "types-beautifulsoup4",
  "bandit>=1.7.0",
  "safety>=3.0.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]

[project.urls]
Repository = "https://github.com/niluferbagevi-gif/Sidar"
Documentation = "https://github.com/niluferbagevi-gif/Sidar/tree/main/docs"
Changelog = "https://github.com/niluferbagevi-gif/Sidar/blob/main/CHANGELOG.md"
Issues = "https://github.com/niluferbagevi-gif/Sidar/issues"

[project.scripts]
sidar = "cli:main"
sidar-gui = "gui_launcher:main"
sidar-web = "web_server:main"

[project.optional-dependencies]
# ── LLM sağlayıcıları (istenilen sağlayıcı için ilgili extras ekleyin) ──
gemini = [
  "google-genai>=1.0.0,<2.0.0",
]
anthropic = [
  "anthropic~=0.40.0",
]
openai = [
  "openai>=2.8.0,<3.0.0",
]
litellm = [
  "litellm>=1.83.7,<2.0.0",
]

# ── Altyapı extras ────────────────────────────────────────────────────────
postgres = [
  "asyncpg~=0.30.0",
  "psycopg2-binary~=2.9.10",
  "pgvector~=0.3.6",
]
telemetry = [
  "prometheus-client~=0.21.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]
rag = [
  "chromadb~=0.5.5",
  "posthog<6.0.0",
  "torch>=2.4.1",
  "torchvision",
  "sentence-transformers>=3.0.1,<6.0.0",
]
lora = [
  "transformers>=5.0.0,<6.0.0",
  "peft>=0.12.0",
  "datasets>=2.20.0",
  "bitsandbytes>=0.43.0; platform_system != 'Darwin'",
]
gpu = [
  "nvidia-ml-py~=12.560.30",
]
# Python Docker SDK for sandbox integrations. This does not install the
# system-level Docker CLI/daemon; use install_sidar.sh prepare-system or the
# Dev Container feature setup for docker/buildx/compose binaries.
sandbox = [
  "docker~=7.1.0",
]
gui = [
  "eel>=0.16.0",
]
slack = [
  "slack-sdk~=3.33.0",
]
browser = [
  "playwright>=1.60,<2.0",
  "selenium~=4.29.0",
]
voice = [
  "SpeechRecognition~=3.10.4",
  "pyaudio~=0.2.14",
  "openai-whisper>=20231117",
]
tools = [
  "yt-dlp>=2024.0.0",
]
aws = [
  "boto3~=1.35.0",
]
jira = [
  "jira~=3.8.0",
]
teams = [
  "pymsteams~=0.2.3",
  "msal>=1.36.0,<2.0.0",
]

# ── Kolaylık profilleri ───────────────────────────────────────────────────
all = [
  "sidar[gemini,anthropic,openai,litellm,postgres,telemetry,rag,lora,gpu,sandbox,gui,slack,browser,voice,tools,aws,jira,teams,dev]",
]
dev = [
  "sidar[postgres]",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-timeout>=2.3.1",
  "pytest-xdist>=3.6.1",
  "freezegun>=1.5.1",
  "pytest-cov~=5.0.0",
  "pytest-benchmark~=4.0.0",
  "pytest-mock>=3.14.0",
  "hypothesis>=6.112.0",
  "respx>=0.21.1",
  "fakeredis>=2.20.0",
  "testcontainers>=4.0.0",
  "ruff~=0.8.1",
  "mypy~=1.11.2",
  "pyright>=1.1.409,<2.0.0",
  "pre-commit>=4.0.0,<5.0.0",
  "shellcheck-py>=0.10.0.1,<0.11.0",
  "types-bleach>=6.1.0.20240311",
  "defusedxml>=0.7.1",
  "types-defusedxml",
  "types-requests",
  "types-PyYAML",
  "types-cachetools",
  "types-beautifulsoup4",
  "bandit>=1.7.0",
  "safety>=3.0.0",
  "opentelemetry-api>=1.29.0",
  "opentelemetry-sdk>=1.29.0",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-httpx>=0.50b0",
  "opentelemetry-exporter-otlp>=1.29.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29.0",
]


[tool.sidar.dependency_profile_plan]
current_install_standard = "uv sync --all-extras"
status = "planned"
owner_doc = "docs/DEPENDENCY_PROFILE_PLAN.md"
summary = "Runtime/dev/test dependency split will be introduced only with coordinated CI, Docker and installer changes."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "runtime"
intent = "Minimum library/runtime dependencies required by core Sidar imports."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "dev"
intent = "pytest, lint, type-check and security-audit tools used by local/CI gates."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "all"
intent = "Current complete developer experience; must keep uv sync --all-extras compatibility."

[[tool.sidar.dependency_profile_plan.profiles]]
name = "production"
intent = "Web/API runtime plus postgres and telemetry extras; no pytest/ruff/mypy/bandit/safety once the split lands."

[tool.bandit]
exclude_dirs = [
  ".git",
  ".venv",
  ".venv-container",
  "tests",
  "web_ui_react",
  "node_modules",
  "artifacts",
  "logs",
  "data",
]
skips = [
  "B101", # Assertions kullanımı
  "B608", # Dinamik SQL ifadeleri için kontrollü kullanım (whitelist + parametreli değerler)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "asyncio: run coroutine test",
  "slow: yavaş entegrasyon testleri (CI'da -m \"not slow\" ile atlanabilir)",
  "gpu: gerçek GPU donanımı gerektiren testler (CI ortamlarında atlanmalıdır)",
  "gpu_stress: uzun/yoğun GPU yük testleri (CI pipeline'ında ayrı job olarak çalıştırılabilir)",
  "pg_stress: PostgreSQL bağlantı havuzu yük testleri (postgres servisi gerektirir)",
  "benchmark: performans baseline testleri",
  "integration: harici sistem entegrasyonları",
  "quality_gate: deterministik kalite kapısı doğrulamaları",
  "shellcheck: shell betikleri için ShellCheck kalite kapısı",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:setuptools",
  "ignore::FutureWarning:torch",
  "ignore::UserWarning:torch",
  "ignore::ResourceWarning",
  "ignore::pydantic.warnings.PydanticDeprecatedSince20",
  "ignore:Field \"model_.*\" has conflict with protected namespace:UserWarning",
  "ignore:Benchmarks are automatically disabled because xdist plugin is active\\.Benchmarks cannot be performed reliably in a parallelized environment\\.:pytest_benchmark.logger.PytestBenchmarkWarning",
  "ignore:invalid escape sequence '\\\\g':DeprecationWarning:sentence_transformers.evaluation.SentenceEvaluator",
  "ignore:invalid escape sequence.*:DeprecationWarning:sentence_transformers.*",
]
log_cli = false
log_cli_level = "INFO"
log_file = "tests/pytest.log"
log_file_level = "DEBUG"
addopts = "--cov=agent --cov=core --cov=managers --cov=plugins --cov=web --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
branch = true
parallel = true
source = ["."]
omit = [
  "*/plug_auto_discover*",
  "*/plug_bad_compile*",
  "conftest.py",
  "migrations/*",
  "temp/*",
  "*/third_party/*",
  "*/templates/*",
  "*:Zone.Identifier",
  "*/__pycache__/*",
  "*/site-packages/*",
  ".venv/*",
  "venv/*",
  ".tox/*",
  ".env",
  "setup.py",
  "web_ui_react/*",
  "web_ui/*",
  "tests/*",
]

[tool.coverage.report]
# Coverage gate threshold is intentionally owned by .coveragerc [report].fail_under.
# run_tests.sh reads that value and applies it once at the final combined report.
show_missing = true
skip_covered = true
precision = 2
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
  "@abstractmethod",
  "@abstractproperty",
  "if 0:",
  "if False:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "Sidar Test Coverage"
extra_css = "assets/dark_mode.css"

[tool.uv]
index-strategy = "first-index"

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]
torchaudio = [
  { index = "pytorch-cpu", marker = "platform_system == 'Darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "core*", "managers*", "plugins*", "sidar_assets*", "web*"]
exclude = ["tests*", "docs*", "scripts*", "data*", "logs*", "*.tests"]

[tool.setuptools]
include-package-data = true
py-modules = ["cli", "main", "web_server", "gui_launcher", "config", "sidar_version", "github_upload"]


[tool.setuptools.package-data]
"*" = ["*.json", "*.yaml", "*.md", "*.sql", "*.css", "*.html", "*.js"]
sidar_assets = [
  "alembic.ini",
  "web_ui_react/dist/**/*",
  "helm/sidar/**/*",
  "migrations/**/*",
  "docker_setup/**/*",
]

[tool.setuptools.data-files]
"share/sidar/web_ui" = ["web_ui/*.html", "web_ui/*.css", "web_ui/*.js"]
"share/sidar/launcher_gui" = ["launcher_gui/*.html", "launcher_gui/*.css", "launcher_gui/*.js"]
"share/sidar/helm" = [
  "helm/sidar/Chart.yaml",
  "helm/sidar/*.yaml",
  "helm/sidar/templates/*.yaml",
  "helm/sidar/templates/*.tpl",
  "helm/sidar/templates/*.txt",
]
"share/sidar/migrations" = [
  "alembic.ini",
  "migrations/*.py",
  "migrations/*.mako",
  "migrations/versions/*.py",
]
"share/sidar/docker_setup" = [
  "docker_setup/prometheus/*.yml",
  "docker_setup/grafana/dashboards/*.json",
  "docker_setup/grafana/provisioning/dashboards/*.yml",
  "docker_setup/grafana/provisioning/datasources/*.yml",
]
"share/sidar/runbooks" = [
  "runbooks/*.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  ".venv-container",
  "__pycache__",
  "data",
  "logs",
  "migrations",
  "docker_setup",
  "build",
  "dist",
  "temp",
  "web_ui",
  "web_ui_react",
  "launcher_gui",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "W",
  "I",
  "B",
  "UP",
  "ASYNC",
  "D",
]
ignore = [
  "E501",
  # D100-D107 eksik docstring kuralları kademeli dokümantasyon kampanyasına ayrıldı;
  # agent rol kontratları şimdilik tests/unit/agent/test_builtin_role_contracts.py ile korunur.
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D105",
  "D106",
  "D107",
  # Mevcut docstring stili geçişte korunur; yeni dokümantasyon Google convention'a uymalıdır.
  "D200",
  "D202",
  "D205",
  "D209",
  "D212",
  "D403",
  "D415",
  "D417",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.File",
  "fastapi.Path",
  "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
explicit_package_bases = true
namespace_packages = true
mypy_path = "$MYPY_CONFIG_FILE_DIR"
files = [
  "agent",
  "core",
  "managers",
  "plugins",
  "web",
  "cli.py",
  "main.py",
  "web_server.py",
  "config.py",
  "sidar_version.py",
  "github_upload.py",
  "gui_launcher.py",
]
warn_unused_configs = true
warn_return_any = true
show_error_codes = true
pretty = true
exclude = [
  "^tests/",
  "^data/",
  "^logs/",
  "^temp/",
  "^migrations/",
  "^build/",
  "^web_ui/",
  "^web_ui_react/",
  "^launcher_gui/",
  "^\\.venv/",
  "^sidar\\.egg-info/",
  "^\\.mypy_cache/",
]

[[tool.mypy.overrides]]
module = [
  "google.genai",
  "google.genai.*",
  "google.generativeai",
  "google.generativeai.*",
  "chromadb",
  "chromadb.*",
  "sentence_transformers",
  "sentence_transformers.*",
  "duckduckgo_search",
  "duckduckgo_search.*",
  "github",
  "github.*",
  "opentelemetry",
  "opentelemetry.*",
  "redis",
  "redis.*",
  "prometheus_client",
  "prometheus_client.*",
  "asyncpg",
  "asyncpg.*",
  "pyttsx3",
  "pyttsx3.*",
  "psycopg2",
  "psycopg2.*",
  "torch",
  "torch.*",
  "pynvml",
  "pynvml.*",
  "docker",
  "docker.*",
  "eel",
  "eel.*",
  "datasets",
  "datasets.*",
  "peft",
  "peft.*",
  "transformers",
  "transformers.*",
  "tiktoken",
  "jira",
  "jira.*",
  "slack_sdk",
  "slack_sdk.*",
  "msal",
  "msal.*",
  "bs4",
  "bs4.*",
  "playwright",
  "playwright.*",
  "bleach",
  "bleach.*",
]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "playwright>=1.60,<2.0",
]
