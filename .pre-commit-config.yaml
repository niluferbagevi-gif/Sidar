default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy strict type check
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types_or: [python, pyi]


      - id: sync-core-install-manifest
        name: sync core install manifest
        entry: scripts/sync_install_manifest.sh
        language: system
        pass_filenames: false
        files: ^(core/memory\.py|core/multimodal\.py)$

      - id: sync-install-module-hashes
        name: sync install module hashes manifest
        entry: scripts/sync_install_module_hashes.sh
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|scripts/install_modules/.*\.(sh|ps1))$
      - id: shellcheck
        name: shellcheck shell scripts
        entry: uv run shellcheck --severity=warning -x
        language: system
        files: ^(install_sidar\.sh|autonomous_loop\.sh|run_tests\.sh|scripts/.*\.(sh|bash)|tests/shell/.*\.bats)$

      - id: shellcheck-installer-modules
        name: shellcheck installer modules
        entry: bash -lc 'shopt -s globstar nullglob; uv run shellcheck --severity=warning -x install_sidar.sh scripts/install_modules/**/*.sh'
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|scripts/install_modules/.*\.sh)$
