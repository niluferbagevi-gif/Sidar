default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format-check
        name: ruff format check
        entry: uv run ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy strict type check
        entry: uv run mypy .
        language: system
        pass_filenames: false
        types_or: [python, pyi]

      - id: pytest-meta-contracts
        name: pytest meta/config contracts
        entry: uv run pytest -q --no-cov -x tests/unit/scripts tests/unit/test_dependency_profile_plan.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: check-core-install-manifest
        name: check core install manifest drift
        entry: uv run python scripts/tools/update_core_install_manifest.py --check
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|\.sidar_manifest\.txt|core/(memory|multimodal)\.py|scripts/sync_install_manifest\.sh|scripts/tools/update_core_install_manifest\.py)$
        stages: [pre-commit, pre-push]

      - id: check-install-module-hashes
        name: check install module hash manifest drift
        entry: uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check-manifest-only
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|scripts/install_modules/.*\.(sh|ps1)|scripts/sync_install_module_hashes\.sh|scripts/tools/update_install_module_hash_manifest\.py)$
        stages: [pre-commit]
      - id: check-install-module-pin
        name: check install module pinned commit
        entry: uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|scripts/install_modules/.*\.(sh|ps1)|scripts/sync_install_module_hashes\.sh|scripts/tools/update_install_module_hash_manifest\.py)$
        stages: [pre-push]
      - id: shellcheck
        name: shellcheck shell scripts
        entry: uv run shellcheck --severity=warning -x
        language: system
        files: ^(install_sidar\.sh|autonomous_loop\.sh|run_tests\.sh|scripts/.*\.(sh|bash)|tests/shell/.*\.bats)$

      - id: shellcheck-installer-modules
        name: shellcheck installer modules
        entry: bash -lc 'shopt -s globstar nullglob; uv run shellcheck --severity=warning -x install_sidar.sh scripts/install_modules/**/*.sh'
        language: system
        pass_filenames: false
        files: ^(install_sidar\.sh|scripts/install_modules/.*\.sh)$
