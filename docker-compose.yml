# Core stack: redis, postgres, ollama (cpu), sidar-migrate, docker-socket-proxy,
# sidar-ai (CLI), sidar-web. Her zaman gerekli, temel servisler burada; GPU ve
# observability servisleri okunabilirlik için ayrı dosyalara taşındı:
#
#   docker-compose.gpu.yml           — ollama-gpu, sidar-gpu, sidar-web-gpu
#                                       (profiles: ["gpu"])
#   docker-compose.observability.yml — jaeger, exporter'lar, cadvisor,
#                                       prometheus, grafana
#                                       (profiles: ["observability"])
#   docker-compose.production.yml    — production sertleştirme overlay'i
#                                       (mevcut, değişmedi)
#
# Kullanım:
#   docker compose up --build                                    # yalnız core (cpu profili)
#   docker compose --profile cpu up --build                      # aynısı, açık
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile gpu up
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile cpu --profile observability up
#
# `-f` ile birleştirilen dosyalar (compose-spec çok-dosya merge): her dosya
# yeni servisler ekler veya var olanları override eder; hangi dosyanın hangi
# servisi tanımladığı önemli değildir, tümü tek bir mantıksal stack'e
# birleşir. Bu, docker-compose.production.yml'nin zaten kullandığı aynı
# desendir.
services:
  # Not: Development'ta varsayılan bind-mount kullanılır.
  # Production'ta host permission/chown sorunlarını azaltmak için aşağıdaki
  # env değişkenlerini named volume ile override edin:
  #   SIDAR_DATA_MOUNT=sidar_data_prod
  #   SIDAR_LOGS_MOUNT=sidar_logs_prod
  #   SIDAR_TEMP_MOUNT=sidar_temp_prod

  redis:
    image: redis:7.4-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_redis
    restart: unless-stopped
    # Local geliştirme modundaki uygulamanın Redis'e erişebilmesi için port
    # yalnız loopback arayüzüne bind edilir; LAN/WSL dışına publish edilmez.
    # Redis'in parolasız kalması engellenir; aksi
    # halde host'a erişebilen herhangi bir istemci cache/session/rate-limit
    # anahtarlarını (sidar:rl:*) okuyup yazabilir ve CONFIG SET/modül yükleme
    # üzerinden bilinen RCE geçmişine sahip parolasız Redis'e ulaşabilirdi.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_postgres
    restart: unless-stopped
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sidar}
      - POSTGRES_USER=${POSTGRES_USER:-sidar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env; default passwords are refused}
    # Redis'teki gibi: local geliştirme modundaki uygulamanın (POSTGRES_HOST=127.0.0.1)
    # erişebilmesi için port yalnız loopback arayüzüne bind edilir; LAN/WSL dışına
    # publish edilmez — aksi halde host'a erişebilen herhangi bir istemci güçlü bir
    # parola olsa bile portu tarayıp Postgres'e karşı brute-force/DoS deneyebilirdi.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker_setup/postgres/init.d/01_create_envs.sql:/docker-entrypoint-initdb.d/01_create_envs.sql:ro
      - ./docker_setup/postgres/init.d/02_enable_vector.sql:/docker-entrypoint-initdb.d/02_enable_vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sidar} -d $${POSTGRES_DB:-sidar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["cpu"]
    # Diğer tüm servisler (redis, postgres, jaeger, exporter'lar) belirli bir
    # sürüme pinli; yalnız Ollama :latest kullanıyordu — bir upstream sürüm
    # `docker compose pull` sonrası sessizce farklı davranış/API değişikliği
    # getirebilir. Diğerleriyle aynı desende belirli bir sürüme pinlendi
    # (Docker Hub'daki en güncel stabil etiket).
    image: ollama/ollama:0.32.14
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-2048}
    # Ollama'nın kendi API'sinde kimlik doğrulama yoktur; port tüm arayüzlere açık
    # kalırsa LAN/WSL dışından erişebilen herhangi bir istemci modelleri sorgulayabilir,
    # GPU/CPU kaynağını tüketebilir veya model yönetim uçlarına (pull/delete) erişebilir.
    # Redis/Postgres'teki gibi yalnız loopback arayüzüne bind edilir.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Ollama'nın resmi imajının son runtime aşamasında curl/wget yok (yalnız
    # ca-certificates/libvulkan1/libopenblas0 kurulu) — bu yüzden
    # redis/postgres'teki gibi bir curl healthcheck'i "command not found" ile
    # her zaman unhealthy döner. İmajda zaten var olan `ollama` binary'si
    # `ollama list` ile yerel API'ye bağlanır; sunucu ayağa kalkmadan
    # başarısız olur. Önceden yalnız `condition: service_started` vardı —
    # container process'i başlaması API'nin istek almaya hazır olduğu
    # anlamına gelmiyordu, bağımlı servisler (sidar-web) ilk isteklerinde
    # bağlantı hatası alabiliyordu.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # GPU profil servisleri (ollama-gpu, sidar-gpu, sidar-web-gpu) artık
  # docker-compose.gpu.yml'de: docker compose -f docker-compose.yml
  # -f docker-compose.gpu.yml --profile gpu up

  sidar-migrate:
    profiles: ["cpu", "gpu"]
    image: ${SIDAR_DOCKER_IMAGE:-sidar:latest}
    # `image` never resolves against a registry — it only names the locally
    # built tag. Without pull_policy, `docker compose up` tries a registry
    # pull first, fails with a confusing "pull access denied" before falling
    # back to `build:`. Force straight to the local build instead.
    pull_policy: build
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_migrate
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}
    entrypoint: []
    command: ["uv", "run", "alembic", "upgrade", "head"]

  # ── Docker Socket Proxy ─────────────────────────────────────────
  # sidar-ai/sidar-gpu içindeki CodeManager, AI-üretimi kodu izole "sibling"
  # container'larda çalıştırmak için Docker daemon'ına ihtiyaç duyar. Ham
  # /var/run/docker.sock'u doğrudan mount etmek host-root-eşdeğeri erişim
  # verir (container escape) — bu, ACCESS_LEVEL=sandbox adlandırmasıyla
  # çelişir. Bunun yerine yalnızca container create/start/stop/logs gibi
  # gerekli uçları açan, exec/privileged/host-mount gibi tehlikeli uçları
  # kapatan bir proxy üzerinden erişim veriyoruz; ham socket yalnızca bu
  # proxy'ye salt-okunur mount edilir ve proxy host'a hiçbir port açmaz.
  docker-socket-proxy:
    profiles: ["cpu", "gpu"]
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_docker_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - EVENTS=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── CLI Modu — CPU (Varsayılan) ────────────────────────────────
  sidar-ai:
    profiles: ["cpu"]
    image: ${SIDAR_DOCKER_IMAGE:-sidar:latest}
    # `image` never resolves against a registry — it only names the locally
    # built tag. Without pull_policy, `docker compose up` tries a registry
    # pull first, fails with a confusing "pull access denied" before falling
    # back to `build:`. Force straight to the local build instead.
    pull_policy: build
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_agent
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_CPU_LIMIT:-2.0}
    mem_limit: ${SIDAR_MEM_LIMIT:-4g}

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      # Ham host socket'i yerine kısıtlı docker-socket-proxy'e bağlan (bkz. yukarıdaki servis notu).
      - DOCKER_HOST=tcp://docker-socket-proxy:2375

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

    stdin_open: true
    tty: true

  # sidar-gpu (CLI Modu — GPU) artık docker-compose.gpu.yml'de:
  # docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-gpu

  # ── Web Arayüzü — CPU ──────────────────────────────────────────
  sidar-web:
    profiles: ["cpu"]
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_web
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_WEB_CPU_LIMIT:-2.0}
    mem_limit: ${SIDAR_WEB_MEM_LIMIT:-4g}
    command: --quick web --host 0.0.0.0 --port 7860

    ports:
      - "${WEB_PORT:-7860}:7860"

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    # jaeger artık docker-compose.observability.yml'de tanımlı; buradaki
    # soft (required: false) depends_on kaldırıldı — cross-file bir servise
    # referans vermek, o dosya -f ile eklenmediğinde "depends on undefined
    # service" hatası verirdi. Bu yalnızca başlangıç sırası için bir
    # optimizasyondu (ENABLE_TRACING zaten varsayılan false'tur ve jaeger
    # ulaşılamazsa bağlantı hatası zaten gracefully ele alınır), kaldırılması
    # davranışı değiştirmez.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - WEB_HOST=0.0.0.0
      - WEB_PORT=7860
      - MEMORY_ENCRYPTION_KEY=${MEMORY_ENCRYPTION_KEY:-}
      - API_KEY=${API_KEY:-}
      # config.py'nin (ENABLE_TRACING=False) ve .env.advanced.example'ın kendi
      # belgelenmiş varsayılanıyla eşleşir. `jaeger` yalnızca "observability"
      # profili altında başlar (bkz. aşağıdaki jaeger servisi); bu değişken
      # burada true varsayılansaydı, jaeger'sız her cpu/gpu-profilli compose
      # koşusunda (ör. scripts/ci/validate_production_compose.sh) sidar-web
      # jaeger:4317'ye OTLP export denemeye çalışıp DEADLINE_EXCEEDED ile
      # başarısız olur, işlevsel olmayan ama gürültülü boot log'ları üretirdi.
      - ENABLE_TRACING=${ENABLE_TRACING:-false}
      - OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sidar-web}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

  # sidar-web-gpu (Web Arayüzü — GPU) artık docker-compose.gpu.yml'de:
  # docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-web-gpu

  # Observability profil servisleri (jaeger, redis-exporter, postgres-exporter,
  # cadvisor, prometheus-token-init, prometheus, grafana) artık
  # docker-compose.observability.yml'de: docker compose -f docker-compose.yml
  # -f docker-compose.observability.yml --profile observability up

volumes:
  redis_data:
  postgres_data:
    # Keep the historical development volume by default, while allowing
    # disposable/parallel stacks to select an isolated PostgreSQL volume.
    name: ${SIDAR_POSTGRES_VOLUME_NAME:-sidar_postgres_data}
  ollama_data:
  sidar_data_prod:
  sidar_logs_prod:
  sidar_temp_prod:
  prometheus_secrets:
