services:
  # Not: Development'ta varsayılan bind-mount kullanılır.
  # Production'ta host permission/chown sorunlarını azaltmak için aşağıdaki
  # env değişkenlerini named volume ile override edin:
  #   SIDAR_DATA_MOUNT=sidar_data_prod
  #   SIDAR_LOGS_MOUNT=sidar_logs_prod
  #   SIDAR_TEMP_MOUNT=sidar_temp_prod

  redis:
    image: redis:7.4-alpine
    container_name: sidar_redis
    restart: unless-stopped
    # Local geliştirme modundaki uygulamanın Redis'e erişebilmesi için port
    # yalnız loopback arayüzüne bind edilir; LAN/WSL dışına publish edilmez.
    # Redis'in parolasız kalması engellenir; aksi
    # halde host'a erişebilen herhangi bir istemci cache/session/rate-limit
    # anahtarlarını (sidar:rl:*) okuyup yazabilir ve CONFIG SET/modül yükleme
    # üzerinden bilinen RCE geçmişine sahip parolasız Redis'e ulaşabilirdi.
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:0.8.1-pg16
    container_name: sidar_postgres
    restart: unless-stopped
    command: postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-300}
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-sidar}
      - POSTGRES_USER=${POSTGRES_USER:-sidar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env; default passwords are refused}
    # Redis'teki gibi: local geliştirme modundaki uygulamanın (POSTGRES_HOST=127.0.0.1)
    # erişebilmesi için port yalnız loopback arayüzüne bind edilir; LAN/WSL dışına
    # publish edilmez — aksi halde host'a erişebilen herhangi bir istemci güçlü bir
    # parola olsa bile portu tarayıp Postgres'e karşı brute-force/DoS deneyebilirdi.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker_setup/postgres/init.d/01_create_envs.sql:/docker-entrypoint-initdb.d/01_create_envs.sql:ro
      - ./docker_setup/postgres/init.d/02_enable_vector.sql:/docker-entrypoint-initdb.d/02_enable_vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-sidar} -d $${POSTGRES_DB:-sidar}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    profiles: ["cpu"]
    # Diğer tüm servisler (redis, postgres, jaeger, exporter'lar) belirli bir
    # sürüme pinli; yalnız Ollama :latest kullanıyordu — bir upstream sürüm
    # `docker compose pull` sonrası sessizce farklı davranış/API değişikliği
    # getirebilir. Diğerleriyle aynı desende belirli bir sürüme pinlendi
    # (Docker Hub'daki en güncel stabil etiket).
    image: ollama/ollama:0.32.14
    container_name: sidar_ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-2048}
    # Ollama'nın kendi API'sinde kimlik doğrulama yoktur; port tüm arayüzlere açık
    # kalırsa LAN/WSL dışından erişebilen herhangi bir istemci modelleri sorgulayabilir,
    # GPU/CPU kaynağını tüketebilir veya model yönetim uçlarına (pull/delete) erişebilir.
    # Redis/Postgres'teki gibi yalnız loopback arayüzüne bind edilir.
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Ollama'nın resmi imajının son runtime aşamasında curl/wget yok (yalnız
    # ca-certificates/libvulkan1/libopenblas0 kurulu) — bu yüzden
    # redis/postgres'teki gibi bir curl healthcheck'i "command not found" ile
    # her zaman unhealthy döner. İmajda zaten var olan `ollama` binary'si
    # `ollama list` ile yerel API'ye bağlanır; sunucu ayağa kalkmadan
    # başarısız olur. Önceden yalnız `condition: service_started` vardı —
    # container process'i başlaması API'nin istek almaya hazır olduğu
    # anlamına gelmiyordu, bağımlı servisler (sidar-web) ilk isteklerinde
    # bağlantı hatası alabiliyordu.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-gpu:
    profiles: ["gpu"]
    image: ollama/ollama:0.32.14
    container_name: sidar_ollama
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-nvidia}
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-2048}
    # bkz. yukarıdaki ollama servisindeki loopback-bind notu (kimlik doğrulaması olmayan API).
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # bkz. yukarıdaki ollama servisindeki healthcheck notu (curl/wget yok, `ollama list` kullanılır).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sidar-migrate:
    profiles: ["cpu", "gpu"]
    image: ${SIDAR_DOCKER_IMAGE:-sidar:latest}
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: sidar_migrate
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}
    entrypoint: []
    command: ["uv", "run", "alembic", "upgrade", "head"]

  # ── Docker Socket Proxy ─────────────────────────────────────────
  # sidar-ai/sidar-gpu içindeki CodeManager, AI-üretimi kodu izole "sibling"
  # container'larda çalıştırmak için Docker daemon'ına ihtiyaç duyar. Ham
  # /var/run/docker.sock'u doğrudan mount etmek host-root-eşdeğeri erişim
  # verir (container escape) — bu, ACCESS_LEVEL=sandbox adlandırmasıyla
  # çelişir. Bunun yerine yalnızca container create/start/stop/logs gibi
  # gerekli uçları açan, exec/privileged/host-mount gibi tehlikeli uçları
  # kapatan bir proxy üzerinden erişim veriyoruz; ham socket yalnızca bu
  # proxy'ye salt-okunur mount edilir ve proxy host'a hiçbir port açmaz.
  docker-socket-proxy:
    profiles: ["cpu", "gpu"]
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: sidar_docker_socket_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - PING=1
      - VERSION=1
      - POST=1
      - ALLOW_START=1
      - ALLOW_STOP=1
      - ALLOW_RESTARTS=1
      - AUTH=0
      - BUILD=0
      - COMMIT=0
      - CONFIGS=0
      - DISTRIBUTION=0
      - EXEC=0
      - EVENTS=0
      - NETWORKS=0
      - NODES=0
      - PLUGINS=0
      - SECRETS=0
      - SERVICES=0
      - SESSION=0
      - SWARM=0
      - SYSTEM=0
      - TASKS=0
      - VOLUMES=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ── CLI Modu — CPU (Varsayılan) ────────────────────────────────
  sidar-ai:
    profiles: ["cpu"]
    image: ${SIDAR_DOCKER_IMAGE:-sidar:latest}
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: sidar_agent
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_CPU_LIMIT:-2.0}
    mem_limit: ${SIDAR_MEM_LIMIT:-4g}

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      # Ham host socket'i yerine kısıtlı docker-socket-proxy'e bağlan (bkz. yukarıdaki servis notu).
      - DOCKER_HOST=tcp://docker-socket-proxy:2375

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

    stdin_open: true
    tty: true

  # ── CLI Modu — GPU (NVIDIA) ────────────────────────────────────
  # Kullanım: docker compose up sidar-gpu
  # Gereksinim: NVIDIA Container Toolkit kurulu olmalı.
  #   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
  # WSL2 notu: WSL2 üzerinde Docker GPU desteği için önce Windows tarafında
  #   NVIDIA Driver (>=595.x) kurulmalı; WSL2 içinde ayrıca nvidia-ctk kurulumu gerekir:
  #   sudo apt-get install -y nvidia-container-toolkit && sudo nvidia-ctk runtime configure --runtime=docker
  sidar-gpu:
    profiles: ["gpu"]
    image: ${SIDAR_GPU_DOCKER_IMAGE:-sidar-gpu:latest}
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:13.0.0-runtime-ubuntu22.04
        GPU_ENABLED: "true"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    container_name: sidar_agent_gpu
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_GPU_CPU_LIMIT:-4.0}
    mem_limit: ${SIDAR_GPU_MEM_LIMIT:-8g}

    # NVIDIA GPU çalışma zamanı (Docker Compose v2 sözdizimi)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # Tüm GPU'ları bağla; belirli sayı için: count: 1
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-gpu:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - USE_GPU=true
      - GPU_DEVICE=${GPU_DEVICE:-0}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      - GPU_MIXED_PRECISION=${GPU_MIXED_PRECISION:-true}   # Ampere+ (RTX 30xx/40xx) FP16 destekler; eski GPU için .env'de false yapın
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Ham host socket'i yerine kısıtlı docker-socket-proxy'e bağlan (bkz. servis notu).
      - DOCKER_HOST=tcp://docker-socket-proxy:2375

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

    stdin_open: true
    tty: true

  # ── Web Arayüzü — CPU ──────────────────────────────────────────
  sidar-web:
    profiles: ["cpu"]
    build:
      context: .
      args:
        BASE_IMAGE: python:3.11.15-slim
        GPU_ENABLED: "false"
    container_name: sidar_web
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_WEB_CPU_LIMIT:-2.0}
    mem_limit: ${SIDAR_WEB_MEM_LIMIT:-4g}
    command: --quick web --host 0.0.0.0 --port 7860

    ports:
      - "${WEB_PORT:-7860}:7860"

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
        required: false
      ollama:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - WEB_HOST=0.0.0.0
      - WEB_PORT=7860
      - MEMORY_ENCRYPTION_KEY=${MEMORY_ENCRYPTION_KEY:-}
      - API_KEY=${API_KEY:-}
      - ENABLE_TRACING=${ENABLE_TRACING:-true}
      - OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sidar-web}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

  # ── Web Arayüzü — GPU ─────────────────────────────────────────
  # Kullanım: docker compose up sidar-web-gpu
  sidar-web-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:13.0.0-runtime-ubuntu22.04
        GPU_ENABLED: "true"
        TORCH_INDEX_URL: https://download.pytorch.org/whl/cu130
    container_name: sidar_web_gpu
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_WEB_GPU_CPU_LIMIT:-4.0}
    mem_limit: ${SIDAR_WEB_GPU_MEM_LIMIT:-8g}
    command: --quick web --host 0.0.0.0 --port 7860

    ports:
      - "${WEB_GPU_PORT:-7861}:7860"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
        required: false
      ollama-gpu:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - WEB_HOST=0.0.0.0
      - WEB_PORT=7860
      - USE_GPU=true
      - GPU_DEVICE=${GPU_DEVICE:-0}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      - GPU_MIXED_PRECISION=${GPU_MIXED_PRECISION:-true}   # Ampere+ (RTX 30xx/40xx) FP16 destekler; eski GPU için .env'de false yapın
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MEMORY_ENCRYPTION_KEY=${MEMORY_ENCRYPTION_KEY:-}
      - API_KEY=${API_KEY:-}
      - ENABLE_TRACING=${ENABLE_TRACING:-true}
      - OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sidar-web-gpu}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"


  # Bu bölümdeki observability sidecar'larına (jaeger, exporter'lar, cadvisor,
  # prometheus) bilinçli olarak curl/wget tabanlı bir healthcheck EKLENMEDİ:
  # bir kod incelemesi bunların hiçbirinde healthcheck olmadığını işaret etti,
  # ancak bu sandbox'ta canlı bir Docker daemon olmadığından (yalnızca CLI var)
  # imajların içeriği (shell/wget/curl var mı) doğrulanamadı — ör. Jaeger'ın
  # `all-in-one` imajı ve bazı exporter varyantları minimal/`scratch` tabanlı
  # olup hiç shell içermeyebilir; yanlış bir healthcheck komutu "unhealthy"yi
  # hiçbir zaman geçmeyen, gerçek bir soruna işaret etmeyen kalıcı bir yanlış
  # alarma dönüşür (hiçbir servis bunlara `condition: service_healthy` ile
  # bağımlı değil, yani bunu yanlış yapmak başlangıç sırasını bozmaz ama
  # yanıltıcı bir sağlık durumu üretir). Bunun yerine, aşağıda gerçekten
  # doğrulanabilen ve risksiz olan yarı (kaynak limiti) uygulandı; healthcheck
  # eklemek gerçek bir Docker ortamında her imajın içeriği doğrulanarak ayrı
  # bir değişiklik olarak yapılmalı.
  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.63.0
    container_name: sidar_jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "4317:4317"
    cpus: 1.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  redis-exporter:
    profiles: ["observability"]
    image: oliver006/redis_exporter:v1.67.0
    container_name: sidar_redis_exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}
    depends_on:
      - redis
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  postgres-exporter:
    profiles: ["observability"]
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: sidar_postgres_exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    cpus: 0.25
    mem_limit: 128m
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  cadvisor:
    profiles: ["observability"]
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: sidar_cadvisor
    restart: unless-stopped
    # cAdvisor'ın kendi belgeleri (docs/running.md) `--privileged`'in her
    # zaman şart olmadığını, yalnız bazı kilitli dağıtımlarda (RHEL/CentOS
    # tarzı) gerekli olduğunu ve daha dar bir alternatif olarak
    # `--device=/dev/kmsg` + özel bir seccomp profiliyle de çalışabileceğini
    # belirtiyor. Burada zaten `/dev/kmsg` device'ı ayrıca mount ediliyor
    # (aşağıda) — bu da privileged'i teorik olarak gereksiz kılabilir. Ama bu
    # sandbox'ta gerçek bir host/kernel üzerinde doğrulama imkanı yok ve
    # yanlış giderse cadvisor'ın bazı host konfigürasyonlarında (özellikle
    # cgroup v1/v2 karışık ortamlar) container metriklerini sessizce
    # toplayamaz hale gelmesi riski var; bu yüzden cadvisor'ın kendi
    # varsayılan/önerilen duruşu korunuyor, yalnızca gerekçesi belgelendi.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    cpus: 1.0
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # prometheus.yml, sidar-web/sidar-gpu job'ları için bearer_token_file ile
  # METRICS_TOKEN okur (bkz. dosyadaki not — bu uçlar zaten her zaman
  # Authorization: Bearer ister). prometheus.yml statik bir dosya olduğundan
  # token'ı doğrudan içeremez; bu tek-seferlik servis METRICS_TOKEN'ı
  # prometheus'un salt-okunur config mount'undan ayrı, yazılabilir bir named
  # volume'e dosya olarak yazar. METRICS_TOKEN boşsa fail-closed durur —
  # prometheus onsuz zaten hiçbir sidar-web/-gpu metriği toplayamaz.
  prometheus-token-init:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    container_name: sidar_prometheus_token_init
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        printf '%s' "${METRICS_TOKEN:?Set a METRICS_TOKEN in .env; sidar-web/-gpu metrics endpoints always require Authorization: Bearer and Prometheus cannot scrape them without it}" > /etc/prometheus-secrets/metrics_token
        chmod 400 /etc/prometheus-secrets/metrics_token
    volumes:
      - prometheus_secrets:/etc/prometheus-secrets

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.54.1
    container_name: sidar_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./docker_setup/prometheus:/etc/prometheus:ro
      - prometheus_secrets:/etc/prometheus-secrets:ro
    depends_on:
      redis-exporter:
        condition: service_started
      postgres-exporter:
        condition: service_started
      cadvisor:
        condition: service_started
      prometheus-token-init:
        condition: service_completed_successfully
    cpus: 1.0
    mem_limit: 1g
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.2.0
    container_name: sidar_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set a strong GRAFANA_ADMIN_PASSWORD in .env; default admin/admin is refused}
    volumes:
      - ./docker_setup/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker_setup/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      - prometheus
    cpus: 0.5
    mem_limit: 512m
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

volumes:
  redis_data:
  postgres_data:
    name: sidar_postgres_data
  ollama_data:
  sidar_data_prod:
  sidar_logs_prod:
  sidar_temp_prod:
  prometheus_secrets:
