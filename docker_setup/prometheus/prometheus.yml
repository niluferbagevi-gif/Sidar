global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "sidar-web"
    metrics_path: /metrics/llm/prometheus
    static_configs:
      - targets: ["sidar-web:7860"]

  - job_name: "sidar-gpu"
    metrics_path: /metrics
    static_configs:
      - targets: ["sidar-web:7860"]

  - job_name: "redis-exporter"
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: "postgres-exporter"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
