[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
truncate_slug_length = 60
timezone = UTC
path_separator = os
# Local development fallback only. Production/container runs must pass
# DATABASE_URL or -x database_url=...; migrations/env.py refuses this
# default when SIDAR_ENV=production to avoid accidental weak credentials.
sqlalchemy.url = postgresql+asyncpg://sidar:sidar@127.0.0.1:5432/sidar

# Logger config blocks are intentionally omitted. migrations/env.py imports
# Sidar's `config` module, which configures the root logger using Sidar's
# canonical "%(asctime)s %(levelname)-7s %(name)s:%(lineno)d › %(message)s"
# format. Re-introducing [loggers]/[handlers]/[formatters] here would cause
# Alembic to install its own StreamHandler+Formatter and duplicate log lines
# in two different formats.
