name: GPU Runner Capacity Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-redundant-capacity:
    name: Verify two online GPU runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify required GPU evidence gate stays enabled
        env:
          GPU_BENCH_GATE_ENABLED: ${{ vars.ENABLE_GPU_BENCH_GATE }}
        run: |
          if [[ "${GPU_BENCH_GATE_ENABLED}" != "true" ]]; then
            echo "::error title=GPU evidence gate disabled::Repository variable ENABLE_GPU_BENCH_GATE must remain exactly true; production readiness cannot rely on local GPU evidence."
            echo "Remediation: gh variable set ENABLE_GPU_BENCH_GATE --body true --repo ${GITHUB_REPOSITORY}"
            exit 1
          fi
      - name: Check primary and warm-standby capacity
        env:
          GPU_RUNNER_MONITOR_TOKEN: ${{ secrets.GPU_RUNNER_MONITOR_TOKEN }}
        run: |
          python scripts/ci/check_gpu_runner_capacity.py \
            --repo "${GITHUB_REPOSITORY}" \
            --minimum-online 2
