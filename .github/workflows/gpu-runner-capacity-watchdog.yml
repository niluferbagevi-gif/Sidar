name: GPU Runner Capacity Watchdog

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [requested]

permissions:
  contents: read
  issues: write

jobs:
  verify-redundant-capacity:
    name: Verify two online GPU runners
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"
      - name: Verify required GPU evidence gate stays enabled
        id: gate_variable
        continue-on-error: true
        env:
          GPU_BENCH_GATE_ENABLED: ${{ vars.ENABLE_GPU_BENCH_GATE }}
        run: |
          if [[ "${GPU_BENCH_GATE_ENABLED}" != "true" ]]; then
            echo "::error title=GPU evidence gate disabled::Repository variable ENABLE_GPU_BENCH_GATE must remain exactly true; production readiness cannot rely on local GPU evidence."
            exit 1
          fi
      - name: Check primary and warm-standby capacity
        id: runner_capacity
        continue-on-error: true
        env:
          GPU_RUNNER_MONITOR_TOKEN: ${{ secrets.GPU_RUNNER_MONITOR_TOKEN }}
        run: |
          python scripts/ci/check_gpu_runner_capacity.py \
            --repo "${GITHUB_REPOSITORY}" \
            --minimum-online 2 \
            --minimum-idle 1
      - name: Open or update GPU runner capacity alert
        if: steps.gate_variable.outcome == 'failure' || steps.runner_capacity.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = "GPU CI runner capacity is not release-ready";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", per_page: 100,
            });
            const existing = issues.find((issue) => !issue.pull_request && issue.title === title);
            const body = [
              "The GPU runner watchdog found a disabled evidence gate, insufficient labeled online runners, or no idle eligible runner.",
              "",
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              "",
              "Verify `ENABLE_GPU_BENCH_GATE=true`, runner services, and the `self-hosted`, `linux`, `x64`, `gpu`, `cuda` labels on two independent hosts.",
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body,
              });
            }
      - name: Enforce GPU runner readiness
        if: steps.gate_variable.outcome == 'failure' || steps.runner_capacity.outcome == 'failure'
        run: exit 1
