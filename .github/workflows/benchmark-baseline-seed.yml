name: Benchmark baseline seed

on:
  workflow_dispatch:
    inputs:
      compare_name:
        description: "pytest-benchmark baseline name used by CI"
        required: false
        default: "baseline"
      benchmark_filter:
        description: "Optional pytest -k filter for a reviewed partial seed run"
        required: false
        default: ""

permissions:
  contents: read
  actions: write

concurrency:
  group: benchmark-baseline-seed-${{ github.ref }}-${{ inputs.compare_name || 'baseline' }}
  cancel-in-progress: false

jobs:
  seed-baseline:
    uses: ./.github/workflows/benchmark-baseline-reusable.yml
    with:
      compare_name: ${{ inputs.compare_name || 'baseline' }}
      benchmark_filter: ${{ inputs.benchmark_filter || '' }}
      retention_days: 90
