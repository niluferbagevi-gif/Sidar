name: Frontend security review

on:
  schedule:
    # Keep the temporary ESLint advisory exception under active review even
    # when no pull request happens near its 2026-09-30 expiry date.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-security-review
  cancel-in-progress: false

jobs:
  npm-audit:
    name: Audit frontend dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_ui_react/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web_ui_react
        run: npm ci

      - name: Run fail-closed frontend dependency audit
        working-directory: web_ui_react
        env:
          FRONTEND_NPM_AUDIT_LEVEL: high
          FRONTEND_NPM_AUDIT_ALLOW_NETWORK_FAILURE: "0"
        run: npm run audit:high

      - name: Upload frontend security evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-security-review-${{ github.run_id }}
          path: artifacts/frontend-security/
          if-no-files-found: error
          retention-days: 30
