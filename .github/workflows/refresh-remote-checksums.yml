name: Refresh remote installer checksums

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request configures its own authenticated remote. Keeping
          # checkout's extraheader produces two Authorization headers and makes
          # the action's initial `git remote prune` fail with HTTP 400.
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.0"
      - name: Install uv-managed Python environment
        run: uv sync --extra dev
      - name: Refresh reviewed remote installer pins
        run: uv run python scripts/install_modules/refresh_remote_checksums.py --pr-body /tmp/remote-checksums-pr.md
      - name: Open checksum refresh pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/refresh-remote-checksums
          title: Refresh remote installer checksum pins
          body-path: /tmp/remote-checksums-pr.md
          commit-message: Refresh remote installer checksum pins
          add-paths: scripts/install_modules/remote_checksums.env
