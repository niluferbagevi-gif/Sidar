name: Nightly Auth Benchmark

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: "Seed this runner's auth benchmark baseline cache (skips the fail-closed comparison for this run only)"
        required: false
        default: false
        type: boolean

concurrency:
  group: nightly-auth-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auth-benchmark:
    # Keep the scheduled comparison on the same stable hardware class as its
    # baseline. Merely enabling comparison on a shared runner is noisy evidence.
    runs-on: [self-hosted, linux, benchmark]
    env:
      AUTH_BENCH_P95_BUDGET_MS: "950"
      AUTH_BENCH_P99_BUDGET_MS: "1200"
      BENCHMARK_CPU_AFFINITY: "0"
      BENCHMARK_COMPARE_REQUIRED: "1"
      BENCHMARK_ENFORCE_COMPARE: "1"
      BENCHMARK_COMPARE_NAME: "baseline"
      BENCHMARK_COMPARE_FAIL: "mean:10%"
      # The baseline cache below is only saved when the job succeeds, so a runner
      # without a baseline can never bootstrap one under the fail-closed schedule.
      # A manual `seed_baseline=true` dispatch is the reviewed bootstrap/reseed path.
      AUTH_BENCH_SEED_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
      # sidar[runtime-gpu] pulls multi-hundred-MB nvidia-*/torch wheels; uv's
      # 30s default HTTP timeout can time out these individual downloads on a
      # slower/self-hosted link well before the transfer itself would fail.
      UV_HTTP_TIMEOUT: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.0"
          # Persistent self-hosted host -- see nightly-gpu-performance.yml.
          # With the cache enabled the post step tried to upload a ~3 GB uv
          # cache to actions/cache, stalled at 0 bytes for ~31 minutes and
          # failed with ECONNRESET, holding the benchmark runner the whole time.
          enable-cache: false

      - name: Pin uv cache to persistent host disk
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Restore auth benchmark baseline cache
        uses: actions/cache@v6
        with:
          path: .benchmarks
          key: auth-benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            auth-benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ github.ref_name }}-
            auth-benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-main-
            auth-benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-master-
            auth-benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-

      # The actions/cache entry above is a few KB, but it shares the repo's
      # 10 GB cache budget with multi-GB CI caches and was LRU-evicted within
      # 18 hours of the 2026-10-01 seed run (the 2026-10-02 schedule then hit
      # "Cache not found" and failed closed). This job always runs on the same
      # persistent self-hosted host, so the baseline is also mirrored on its
      # disk, keyed by runner name like the cache key above.
      - name: Restore auth benchmark baseline from persistent host disk
        run: |
          baseline_dir="${HOME}/.cache/sidar/auth-benchmark-baseline/${RUNNER_NAME}"
          echo "AUTH_BENCH_HOST_BASELINE_DIR=${baseline_dir}" >> "$GITHUB_ENV"
          mkdir -p .benchmarks
          if [[ -d "${baseline_dir}" ]] && find "${baseline_dir}" -type f -name "*_${BENCHMARK_COMPARE_NAME}.json" -print -quit | grep -q .; then
            cp -a "${baseline_dir}/." .benchmarks/
            echo "Host-disk baseline restored from ${baseline_dir}."
          else
            echo "No host-disk baseline under ${baseline_dir}; relying on the actions/cache restore."
          fi

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Best-effort CPU governor setup (performance)
        run: |
          if [[ -w /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor ]]; then
            echo performance | tee /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
          else
            echo "CPU governor değiştirilemedi (runner izni yok) - benchmark devam ediyor."
          fi

      - name: Run auth benchmark suite with isolated CPU pinning
        run: |
          mkdir -p artifacts/auth-benchmark
          mkdir -p .benchmarks
          compare_file="$(find .benchmarks -type f -name "*_${BENCHMARK_COMPARE_NAME}.json" -print 2>/dev/null | sort -V | tail -n 1)"
          compare_args=()
          if [[ "${AUTH_BENCH_SEED_BASELINE}" == "true" ]]; then
            echo "::notice title=Auth benchmark baseline seed::seed_baseline=true; comparison skipped, a new ${BENCHMARK_COMPARE_NAME} baseline is saved for runner ${RUNNER_NAME}."
          elif [[ -n "${compare_file}" ]]; then
            compare_args+=(--benchmark-compare="${compare_file}")
            if [[ "${BENCHMARK_ENFORCE_COMPARE}" == "1" ]]; then
              compare_args+=(--benchmark-compare-fail="${BENCHMARK_COMPARE_FAIL}")
            fi
          elif [[ "${BENCHMARK_COMPARE_REQUIRED}" == "1" ]]; then
            echo "BENCHMARK_COMPARE_REQUIRED=1 ancak .benchmarks altında ${BENCHMARK_COMPARE_NAME} baseline bulunamadı."
            exit 1
          fi
          CMD="uv run pytest -q tests/performance/test_benchmark.py -k \"password_ and cpu_cost\" --benchmark-json=artifacts/auth-benchmark/benchmark.json --benchmark-min-rounds=30 --benchmark-save=${BENCHMARK_COMPARE_NAME} ${compare_args[*]}"
          if command -v taskset >/dev/null 2>&1; then
            taskset -c "${BENCHMARK_CPU_AFFINITY}" bash -lc "${CMD}"
          else
            echo "taskset bulunamadı, benchmark pinleme olmadan çalıştırılıyor."
            bash -lc "${CMD}"
          fi

      - name: Evaluate P95/P99 regression budgets
        run: python scripts/ci/check_auth_benchmark_thresholds.py artifacts/auth-benchmark/benchmark.json

      # Only a run that passed the compare and P95/P99 budgets (or a reviewed
      # manual seed) may become the next baseline, matching actions/cache's
      # save-on-success semantics.
      - name: Persist auth benchmark baseline to persistent host disk
        if: success()
        run: |
          mkdir -p "${AUTH_BENCH_HOST_BASELINE_DIR}"
          cp -a .benchmarks/. "${AUTH_BENCH_HOST_BASELINE_DIR}/"
          # --benchmark-save adds one file per run; keep the newest 30.
          find "${AUTH_BENCH_HOST_BASELINE_DIR}" -type f -name "*_${BENCHMARK_COMPARE_NAME}.json" -print \
            | sort -V | head -n -30 | xargs -r rm -f --
          echo "Baseline persisted to ${AUTH_BENCH_HOST_BASELINE_DIR}."

      - name: Upload auth benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-auth-benchmark
          path: artifacts/auth-benchmark/
          if-no-files-found: warn
          retention-days: 14
