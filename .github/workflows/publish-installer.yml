name: Publish Bundled Installer

on:
  push:
    branches: ["main"]
    paths:
      - "install_sidar.sh"
      - "scripts/install_modules/**"
      - "scripts/tools/bundle_install_sidar.sh"
      - ".github/workflows/publish-installer.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundled-installer:
    name: Build and publish single-file installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build bundled installer
        run: bash scripts/tools/bundle_install_sidar.sh

      - name: Verify bundled installer is self-contained
        run: |
          test -s dist/install_sidar.sh
          test -x dist/install_sidar.sh
          test "$(grep -c '^# --- MODULE:' dist/install_sidar.sh)" -ge 15
          grep -q '^# --- MODULE: .*/install_helpers.sh ---$' dist/install_sidar.sh
          grep -q '^# --- MODULE: .*/utils/install_remediation.sh ---$' dist/install_sidar.sh
          grep -q '^# --- MODULE: .*/phases/07_finish.sh ---$' dist/install_sidar.sh
          bash -n dist/install_sidar.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: install_sidar.sh
          path: dist/install_sidar.sh
          if-no-files-found: error

      - name: Publish stable installer release asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f installer-latest "${GITHUB_SHA}"
          git push -f origin refs/tags/installer-latest
          gh release view installer-latest >/dev/null 2>&1 || \
            gh release create installer-latest \
              --title "Latest Sidar installer" \
              --notes "Moving release that contains the latest bundled single-file install_sidar.sh generated from main."
          gh release upload installer-latest dist/install_sidar.sh --clobber

      - name: Attach installer to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/install_sidar.sh --clobber
