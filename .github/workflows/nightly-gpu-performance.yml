name: Nightly GPU Performance

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-gpu-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-performance-benchmarks:
    name: GPU Benchmark Suite (nightly)
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    # Ortak labels primary arızasında warm-standby'a otomatik yönlendirme sağlar.
    # Üç aylık failover tatbikatı: docs/runbooks/gpu-runner-continuity.md
    timeout-minutes: 90

    env:
      RUN_GPU_STRESS: "1"
      RUN_GPU_BENCHMARKS: "full"
      PYTHONUNBUFFERED: "1"
      GPU_TREND_WINDOW: "7"
      GPU_TREND_THRESHOLD_PERCENT: "20"
      # sidar[runtime-gpu] pulls multi-hundred-MB nvidia-*/torch wheels; uv's
      # 30s default HTTP timeout can time out these individual downloads on a
      # slower/self-hosted link well before the transfer itself would fail.
      UV_HTTP_TIMEOUT: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.12.0"
          # Persistent self-hosted GPU host -- see ci.yml benchmark-compare's
          # "Set up uv" step. With the cache enabled the post step tried to
          # upload a ~3 GB uv cache (torch/nvidia-* wheels) to actions/cache
          # at ~0.3 MB/s: ~59 minutes of the 90-minute budget, ending in a
          # getaddrinfo EAI_AGAIN warning without ever saving the cache.
          # uv's local disk cache already survives between runs here.
          enable-cache: false

      - name: Pin uv cache to persistent host disk
        # setup-uv exports UV_CACHE_DIR under $RUNNER_TEMP regardless of
        # enable-cache, and the runner clears that between jobs. Point it
        # at the host's persistent home directory so the multi-GB GPU
        # wheels are downloaded once and reused by later nightly runs.
        run: echo "UV_CACHE_DIR=$HOME/.cache/uv" >> "$GITHUB_ENV"

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Restore GPU trend history cache
        id: gpu-trend-cache
        uses: actions/cache/restore@v6
        with:
          path: .ci-history/gpu_trend_history.json
          key: gpu-trend-history-${{ runner.os }}-${{ runner.name }}-${{ github.ref_name }}

      - name: Detect GPU driver version
        id: gpu-driver
        run: |
          DRIVER="$(nvidia-smi --query-gpu=driver_version --format=csv,noheader | head -n1 | tr -d ' ')"
          if [[ -z "$DRIVER" ]]; then
            DRIVER="unknown-driver"
          fi
          echo "value=$DRIVER" >> "$GITHUB_OUTPUT"

      - name: Run nightly GPU performance benchmarks
        run: |
          mkdir -p artifacts/gpu
          uv run pytest -c pyproject.toml -v tests/performance \
            -m "benchmark and gpu" \
            -n 0 \
            --no-cov \
            --benchmark-json=artifacts/gpu/benchmark.json

      - name: Check 7-run median trend guards (TTFT/TPS/VRAM peak/load latency)
        run: |
          python scripts/ci/check_gpu_benchmark_trend.py \
            artifacts/gpu/benchmark.json \
            .ci-history/gpu_trend_history.json \
            "$GPU_TREND_WINDOW" \
            "$GPU_TREND_THRESHOLD_PERCENT" \
            "${{ steps.gpu-driver.outputs.value }}"

      - name: Save GPU trend history cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .ci-history/gpu_trend_history.json
          key: gpu-trend-history-${{ runner.os }}-${{ runner.name }}-${{ github.ref_name }}

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-gpu-performance-artifacts
          path: |
            artifacts/gpu/
            .ci-history/gpu_trend_history.json
            .benchmarks/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 14
