name: CodeQL

# Semantic/dataflow SAST for both Python and JS/TS. Bandit (see ci.yml's "Run
# SAST gates" step) is pattern/AST-based and Python-only — it has no
# interprocedural taint tracking and no JS/TS coverage at all. CodeQL closes
# both gaps: it builds a semantic database and runs dataflow/taint-tracking
# queries (SQL injection, SSRF, path traversal, XSS, command injection, etc.)
# across function/module boundaries, for both languages in this repo.
#
# Findings surface as code scanning alerts on the Security tab and as PR
# review annotations — this workflow intentionally does not fail the build on
# a finding (the standard CodeQL deployment model: alerts are triaged, not
# used as a hard merge gate, since blocking every PR on an unreviewed finding
# would make false positives a shipped-code blocker). The job itself only
# fails on a genuine analysis error.

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  schedule:
    # Catches newly-published CodeQL query packs against unchanged code.
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended: broader dataflow/taint-tracking query coverage
          # than the default suite (which favors precision over recall).
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
