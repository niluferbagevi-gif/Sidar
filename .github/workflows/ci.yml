name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      seed_benchmark_baseline:
        description: "Seed .benchmarks baseline cache/artifact without running the fail-closed production-readiness gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-benchmark-baseline:
    name: Seed benchmark baseline cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_benchmark_baseline }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/benchmark-baseline-reusable.yml
    with:
      compare_name: baseline
      benchmark_filter: ""
      retention_days: 90

  test:
    name: Base quality gates (lint, smoke, unit, coverage, frontend)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    # Release-blocking Playwright evidence must use an explicitly supported,
    # stable host image. Local Ubuntu 26.04 overrides are developer compatibility,
    # not release evidence.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          # Test-only CI service credentials; production samples/runbooks must not reuse this password.
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar
          POSTGRES_DB: sidar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      AUTO_DOCKER_TEST_SERVICES: "0"
      AUTO_PREPARE_TEST_DB: "0"
      SMOKE_SKIP_EXTERNAL_INFRA: "0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Test-only CI service credentials matching the ephemeral postgres service above.
      POSTGRES_USER: sidar
      POSTGRES_PASSWORD: sidar
      POSTGRES_DB: sidar
      TEST_DATABASE_NAME: sidar_test
      TEST_DATABASE_USER: sidar
      TEST_DATABASE_PASSWORD: sidar
      DATABASE_URL: postgresql+asyncpg://sidar:sidar@localhost:5432/sidar_test
      REDIS_URL: redis://localhost:6379/0
      # CI production-readiness is a quality gate, not an app production runtime.
      # Keep runtime config in the isolated test profile so weak ephemeral
      # service credentials above cannot satisfy or mask production-secret tests.
      SIDAR_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # check-install-manifests runs update_install_module_hash_manifest.py
          # --check-pin, which does `git show <pinned commit>:<path>` against
          # SIDAR_INSTALLER_EMBEDDED_SOURCE_COMMIT. A shallow (depth=1) clone
          # doesn't have that commit's history, so full history is required.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          # Cache uv's wheel/download store so large wheels like pyarrow do not
          # have to be refetched on every run; a missed cache turns a
          # network/tunnel blip into a CI red. The cache key is derived from
          # uv.lock so a lockfile change naturally invalidates it.
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Verify canonical toolchain contract
        run: python scripts/ci/check_toolchain_contract.py

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Check release version consistency
        run: uv run python scripts/check_release_version_consistency.py

      - name: Check dated policy/debt expirations
        run: uv run python scripts/ci/check_policy_dates.py

      - name: Diagnose environment (always)
        if: always()
        run: |
          echo "=== uv ===" && uv --version || echo "uv not found"
          echo "=== venv ===" && ls .venv/bin/python3 2>/dev/null || echo "venv missing"
          echo "=== portaudio ===" && dpkg -l portaudio19-dev 2>/dev/null || echo "portaudio not installed"
          echo "=== shellcheck ===" && shellcheck --version 2>/dev/null || echo "shellcheck not found"
          echo "=== bats ===" && bats --version 2>/dev/null || echo "bats not found"

      - name: Verify installer manifests
        run: make check-install-manifests

      - name: Run installer ShellCheck
        run: make lint-shell

      - name: Run installer BATS tests
        run: make test-shell

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_VERSION_PROBE_ONLY=1 bash dist/install_sidar.sh

      - name: Upload standalone installer bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-install-sidar
          path: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
            dist/INSTALLER_USAGE.md
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v6
        with:
          node-version-file: web_ui_react/.nvmrc
          cache: 'npm'
          cache-dependency-path: web_ui_react/package-lock.json

      - name: Run Python lint gate (ruff)
        run: uv run ruff check .

      - name: Check Ruff docstring and ASYNC240 debt baseline
        run: uv run python scripts/ci/check_ruff_debt_baseline.py

      - name: Check production source debt markers
        run: uv run python scripts/ci/check_source_debt_markers.py

      - name: Check production coverage exclusion budget
        run: uv run python scripts/ci/check_coverage_exclusion_budget.py

      - name: Check module-notes documentation inventory
        run: uv run python scripts/ci/check_module_notes_inventory.py

      - name: Run Python format check gate (ruff format)
        run: uv run ruff format --check .

      - name: Run frontend lint gate (eslint)
        run: |
          cd web_ui_react
          npm ci
          npm run lint

      - name: Run frontend type-check gate (tsc)
        run: |
          cd web_ui_react
          npm run typecheck

      - name: Run frontend dependency audit gate
        env:
          FRONTEND_NPM_AUDIT_LEVEL: high
          FRONTEND_NPM_AUDIT_ALLOW_NETWORK_FAILURE: "0"
        run: |
          cd web_ui_react
          npm run audit:high

      - name: Restore Playwright browser cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-ubuntu-24.04-${{ hashFiles('web_ui_react/package-lock.json') }}
          restore-keys: |
            playwright-ubuntu-24.04-

      - name: Install Playwright Chromium for frontend smoke tests
        run: |
          cd web_ui_react
          npx playwright install --with-deps chromium

      - name: Attest canonical Playwright browser environment
        env:
          PLAYWRIGHT_EVIDENCE_PATH: ../artifacts/playwright/canonical-environment.json
        run: |
          cd web_ui_react
          mkdir -p ../artifacts/playwright
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const { chromium } = require('@playwright/test');
          const packageJson = require('@playwright/test/package.json');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage();
            await page.setContent('<title>Sidar canonical Playwright evidence</title>');
            const title = await page.title();
            if (title !== 'Sidar canonical Playwright evidence') {
              throw new Error(`Unexpected Chromium smoke title: ${title}`);
            }
            const evidence = {
              schema_version: 1,
              evidence_kind: 'canonical-ci-browser-environment',
              github_sha: process.env.GITHUB_SHA || null,
              runner_os: process.env.RUNNER_OS || null,
              runner_arch: process.env.RUNNER_ARCH || null,
              image_os: process.env.ImageOS || null,
              platform: os.platform(),
              platform_release: os.release(),
              node_version: process.version,
              playwright_version: packageJson.version,
              browser_name: 'chromium',
              browser_version: browser.version(),
              headless_launch_smoke: 'passed',
            };
            await browser.close();
            fs.writeFileSync(
              path.resolve(process.env.PLAYWRIGHT_EVIDENCE_PATH),
              `${JSON.stringify(evidence, null, 2)}\n`,
              'utf8',
            );
          })().catch((error) => {
            console.error(error);
            process.exitCode = 1;
          });
          NODE

      - name: Run SAST gates (Bandit + pip-audit)
        run: |
          uv run python scripts/ci/check_bandit_suppression_baseline.py
          mkdir -p artifacts/security
          mapfile -t pip_audit_ignore_args < <(python scripts/pip_audit_ignore_args.py)
          stderr_log=artifacts/security/pip-audit-stderr.log
          : > "${stderr_log}"
          if uv run --with pip-audit pip-audit --skip-editable --timeout 30 --format json --output artifacts/security/pip-audit-report.raw.json "${pip_audit_ignore_args[@]}" 2> "${stderr_log}"; then
            exit 0
          fi
          cat "${stderr_log}" >&2 || true
          python scripts/pip_audit_failure_artifact.py artifacts/security/pip-audit-report.raw.json artifacts/security/pip-audit-failure.json --timeout 30 --stderr-log "${stderr_log}"
          failure_category=$(python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.loads(p.read_text(encoding="utf-8")).get("failure_category","unknown"))' artifacts/security/pip-audit-failure.json 2>/dev/null || echo unknown)
          echo "pip-audit failure_category=${failure_category}"
          # CI always treats failures as hard errors; the classification lands
          # in the uploaded artifact so reviewers can tell a network blip from
          # a real CVE without reading the raw stderr.
          exit 1

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-audit-artifacts
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect repository metrics
        run: bash scripts/collect_repo_metrics.sh

      - name: Audit source line metrics (standardized)
        run: |
          bash scripts/audit_metrics.sh . markdown
          bash scripts/audit_metrics.sh . json

      - name: Check empty test artifacts
        run: bash scripts/check_empty_test_artifacts.sh

      # Keep this strict contract before pytest. A green Base Quality Gates job
      # therefore proves parity passed and the evidence validator below ran.
      - name: Check .env.example ↔ config.py parity
        run: bash scripts/check_env_parity.sh

      - name: Run deterministic quality gates
        run: >-
          uv run pytest -q --no-cov -m quality_gate
          tests/quality/test_llm_quality_gate.py
          tests/quality/test_shellcheck_quality_gate.py

      # Must run before any smoke/test step below: tests/smoke/test_boot.py
      # connects to the sidar_test database, so it has to exist first.
      - name: Prepare isolated test database (sidar_test) + Alembic upgrade
        env:
          PGPASSWORD: sidar
        run: |
          psql -h localhost -U sidar -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sidar_test WITH (FORCE);" \
            -c "CREATE DATABASE sidar_test;" \
            -c "GRANT ALL PRIVILEGES ON DATABASE sidar_test TO sidar;"
          uv run alembic upgrade head

      - name: Run critical smoke import gates with exit-first
        run: >-
          uv run pytest -q -x --no-cov
          tests/smoke/test_boot.py
          tests/smoke/test_imports.py

      - name: Run installer/runtime smoke verification tests
        run: >-
          uv run pytest -q --no-cov -m installer_smoke

      - name: Run ShellCheck for installer and install modules
        run: |
          shopt -s globstar nullglob
          uv run shellcheck --severity=warning -x install_sidar.sh scripts/install_modules/**/*.sh

      - name: Run base quality gates (performance isolated)
        env:
          # web_ui_react/e2e/ has 8 spec files; only chat-websocket.spec.js
          # ("smoke") ever ran here, so the other 7 panel specs (admin-panels,
          # agent-manager, p2p-dialogue, prompt-admin, swarm-flow, tools-panel,
          # voice-panel) never executed in any automated path -- not in CI, not
          # in any nightly/weekly/release workflow, and not even via `make
          # production-readiness` despite docs/TESTING.md's "yalnız
          # RUN_FRONTEND_E2E=1 ile tam gate'te tetiklenir" claim (that claim
          # was aspirational; FRONTEND_E2E_NPM_SCRIPT was never actually set
          # anywhere but here). Running the full suite surfaced two real,
          # previously-undetected bugs (see the CHANGELOG entry) before this
          # was turned on as release-blocking; test:e2e (all 8 specs, ~10
          # tests) is fast (~12s locally with 2 workers) and self-contained
          # (each spec starts its own mock backend + Vite server, no shared
          # infra), so there's no cost reason to keep it scoped to one file.
          FRONTEND_E2E_NPM_SCRIPT: "test:e2e"
          RUN_FRONTEND_E2E: "1"
          FRONTEND_E2E_ENFORCE_RESULT: "1"
          QUALITY_GATE_EXIT_AFTER_FIRST_FAIL: "1"
          AUTO_BUILD_DOCKER_TEST_IMAGE: "1"
          DOCKER_TEST_IMAGE: "sidar:latest"
          DOCKER_TEST_IMAGE_BUILD_CONTEXT: "."
          # check-bundle-budget.mjs requires both budget vars whenever
          # TEST_PROFILE=ci (or SIDAR_PRODUCTION_READINESS=1) so a CI run can
          # never silently skip the frontend bundle-size gate. Match the
          # ratcheted Makefile defaults (500/160) used by every local
          # `make dev-full`/`make production-readiness` run.
          SIDAR_TOTAL_JS_BUDGET_KB: "500"
          SIDAR_TOTAL_GZIP_BUDGET_KB: "160"
          # CI no longer hardcodes a separate pre-merge override; it inherits
          # the ratchet-managed pyproject.toml baseline like the local profile
          # (current local/CI baseline: %100; coverage_ratchet.py only raises it)
          # — see AGENTS.md §2.5.4. Set COVERAGE_FAIL_UNDER_CI explicitly if a
          # stricter ad-hoc pre-merge bar is ever needed again.
        run: |
          set -o pipefail
          mkdir -p artifacts
          TEST_PROFILE=ci RUN_BENCHMARKS=0 RUN_FRONTEND_E2E=1 \
            SIDAR_PRODUCTION_READINESS=0 bash run_tests.sh --stage all \
            2>&1 | tee artifacts/test_run.log

      - name: Enforce real-container plugin sandbox security matrix
        env:
          SIDAR_PLUGIN_SANDBOX_IMAGE: sidar:latest
          SIDAR_REQUIRE_PLUGIN_SANDBOX_CONTAINER_TESTS: "1"
        run: uv run pytest -q -rs tests/integration/web/test_plugin_sandbox_container_escape.py

      - name: Validate base test summary
        run: uv run python scripts/ci/validate_test_summary.py --mode development --summary artifacts/test-summary.json

      - name: Attest current-commit pytest and coverage evidence
        run: uv run python scripts/ci/validate_pytest_evidence.py --commit-sha "${GITHUB_SHA}"

      - name: Verify committed coverage ratchet baseline
        run: |
          if ! git diff --exit-code -- pyproject.toml; then
            echo "::error::pyproject.toml coverage fail_under changed during run_tests.sh. Commit the ratcheted baseline in a dedicated PR or lower the measured run below the ratchet threshold intentionally."
            exit 1
          fi

      - name: Upload run_tests.sh full log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-run-log
          path: artifacts/test_run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mypy failure logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-error-logs
          path: artifacts/mypy_errors*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print last 300 lines of test_run.log on failure
        if: failure()
        run: tail -n 300 artifacts/test_run.log || true

      - name: Upload Playwright frontend smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-playwright-report
          path: |
            web_ui_react/playwright-report/
            web_ui_react/test-results/
            artifacts/playwright/canonical-environment.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload BATS JUnit Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bats-junit-report
          path: artifacts/bats/report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-report
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test summary, coverage XML/JSON + Benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-quality-trend-artifacts
          path: |
            artifacts/test-summary.json
            artifacts/pytest-evidence.json
            coverage.json
            coverage.xml
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/history.json
            artifacts/frontend-bundle-budget.json
            .benchmarks/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage-report
          path: |
            web_ui_react/coverage/
            web_ui_react/coverage/lcov-report/
            web_ui_react/coverage/lcov.info
            web_ui_react/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

  installer-smoke:
    # Branch protection should mark this job name as required. It runs on every
    # PR/push so installer drift cannot merge unnoticed when any of these
    # release-critical paths change: install_sidar.sh, .sidar_manifest.txt,
    # core/memory.py, core/multimodal.py, scripts/install_modules/**,
    # scripts/sync_install_manifest.sh, scripts/tools/update_core_install_manifest.py,
    # scripts/tools/update_install_module_hash_manifest.py.
    name: Installer manifest and smoke gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # check-install-manifests --check-pin needs the full history to
          # `git show` the commit pinned in SIDAR_INSTALLER_EMBEDDED_SOURCE_COMMIT;
          # a shallow (depth=1) clone doesn't have it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Required installer manifest drift gate
        run: make check-install-manifests

      - name: Required installer ShellCheck gate
        run: make installer-shellcheck

      - name: Required embedded manifest sync test
        run: >-
          uv run pytest -q --no-cov
          tests/smoke/test_install_verification.py::test_install_sidar_embedded_manifests_in_sync

      - name: Verify installer manifests and pinned module commit directly
        run: |
          sha256sum -c .sidar_manifest.txt
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check-pin

      - name: Treat raw GitHub installer as release artifact
        run: |
          bash -n install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_ABORT_AFTER_HASH_VERIFY=1 bash install_sidar.sh

      - name: Verify installer smoke isolation from user secrets
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          printf 'OPENAI_API_KEY=%0200000d\n' 0 > "$test_home/.sidar_keys.env"

          HOME="$test_home" \
          SIDAR_KEYS_FILE="$test_home/.sidar_keys.env" \
          SIDAR_TEST_LOAD_REAL_KEYS=0 \
          uv run pytest \
            -q --no-cov -p no:xdist -x \
            --confcutdir=tests/smoke \
            tests/smoke/test_install_verification.py

      - name: Run installer smoke suite
        run: >-
          uv run pytest -q --no-cov -m installer_smoke

  benchmark-compare:
    name: Benchmark compare gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    # A shared ubuntu-latest VM is too noisy for a release-blocking latency
    # comparison. The baseline seed jobs use the same named runner/cache scope.
    runs-on: [self-hosted, linux, benchmark]

    env:
      # sidar[runtime-gpu] pulls multi-hundred-MB nvidia-*/torch wheels; uv's
      # 30s default HTTP timeout can time out these individual downloads on a
      # slower/self-hosted link well before the transfer itself would fail.
      UV_HTTP_TIMEOUT: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Restore benchmark baseline cache
        id: benchmark-baseline-cache
        uses: actions/cache@v6
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-${{ github.ref_name }}-
            benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-main-
            benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-master-
            benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-

      - name: Resolve benchmark baseline gate mode
        id: benchmark-baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmarks artifacts/benchmark
          benchmark_compare_name="${BENCHMARK_COMPARE_NAME:-baseline}"
          compare_file="$(find .benchmarks -type f -name "*_${benchmark_compare_name}.json" -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$compare_file" ]]; then
            # No baseline is visible in any cache scope this run can reach. This is
            # expected the first time a PR touches uv.lock: GitHub Actions cache
            # access for a pull_request-triggered run is limited to this run's own
            # ref (refs/pull/<n>/merge), the PR's base branch, and the repo default
            # branch -- a baseline seeded on the PR's *head* branch (e.g. via
            # workflow_dispatch) is out of scope and never restorable here, and a
            # baseline seeded on the base branch only matches when uv.lock is
            # identical to the base branch's, which a dependency-touching PR breaks.
            # Bootstrap instead of failing closed: generate this run's own baseline
            # and save it under this run's ref scope so the *next* push to this PR
            # restores it and gets a real regression comparison.
            echo "mode=bootstrap" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmark baseline::No cached baseline found for ${benchmark_compare_name} in a reachable cache scope; bootstrapping one from this run instead of failing closed."
            {
              echo "### Benchmark baseline"
              echo "- No cached baseline found for \`${benchmark_compare_name}\` in a scope this run can access."
              echo "- Bootstrapping: this run generates and saves a fresh \`${benchmark_compare_name}\` under this PR's own cache scope. **No regression comparison was performed this run.**"
              echo "- The next push to this PR (same \`uv.lock\`) will restore this bootstrap baseline and perform a real comparison."
              echo "- To review-gate a curated baseline for \`main\`/\`master\` instead, run: GitHub Actions → CI → Run workflow → \`seed_benchmark_baseline=true\`."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "mode=compare" >> "$GITHUB_OUTPUT"
            echo "compare_file=$compare_file" >> "$GITHUB_OUTPUT"
            echo "::notice title=Benchmark baseline::Using ${compare_file} for compare gate."
          fi

      - name: Run benchmark compare gate
        env:
          DOTENV_FILE: .env.test
          BENCHMARK_JSON_OUTPUT: artifacts/benchmark/benchmark.json
          BENCHMARK_IO_JSON_OUTPUT: artifacts/benchmark/io-benchmark.json
          BENCHMARK_COMPARE_FAIL: mean:10%
          BENCHMARK_IO_COMPARE_FAIL: mean:25%
          BENCHMARK_BASELINE_FILE: ${{ steps.benchmark-baseline.outputs.compare_file }}
          BENCHMARK_MODE: ${{ steps.benchmark-baseline.outputs.mode }}
        run: |
          set -o pipefail
          mkdir -p artifacts/benchmark
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          mode = os.environ["BENCHMARK_MODE"]
          metadata = {"mode": mode}
          if mode == "compare":
              baseline = Path(os.environ["BENCHMARK_BASELINE_FILE"])
              metadata.update(
                  baseline_file=str(baseline),
                  baseline_exists=baseline.exists(),
                  baseline_size_bytes=baseline.stat().st_size if baseline.exists() else 0,
              )
          Path("artifacts/benchmark/baseline-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
          if [[ "${BENCHMARK_MODE}" == "bootstrap" ]]; then
            compare_args=(--benchmark-save=baseline)
            io_compare_args=(--benchmark-save=baseline)
          else
            compare_args=(--benchmark-compare="${BENCHMARK_BASELINE_FILE}" --benchmark-compare-fail="${BENCHMARK_COMPARE_FAIL}")
            io_compare_args=(--benchmark-compare="${BENCHMARK_BASELINE_FILE}" --benchmark-compare-fail="${BENCHMARK_IO_COMPARE_FAIL}")
          fi
          uv run python -m pytest -c pyproject.toml -v tests/performance -n 0 --no-cov \
            --ignore=tests/performance/test_gpu_benchmark.py \
            -k "not test_multi_user_session_message_workload_scales_with_concurrency" \
            --benchmark-json="${BENCHMARK_JSON_OUTPUT}" \
            "${compare_args[@]}" \
            --benchmark-warmup=on \
            --benchmark-warmup-iterations=100000 \
            --benchmark-disable-gc \
            --junitxml=artifacts/benchmark/benchmark-junit.xml \
            2>&1 | tee artifacts/benchmark/benchmark-compare.log
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            uv run python -m pytest -c pyproject.toml -v tests/performance/test_benchmark.py -n 0 --no-cov \
              -k "test_multi_user_session_message_workload_scales_with_concurrency" \
              --benchmark-json="${BENCHMARK_IO_JSON_OUTPUT}" \
              "${io_compare_args[@]}" \
              --benchmark-warmup=on \
              --benchmark-warmup-iterations=100000 \
              --benchmark-disable-gc \
              --junitxml=artifacts/benchmark/io-benchmark-junit.xml \
              2>&1 | tee artifacts/benchmark/io-benchmark-compare.log
            status=${PIPESTATUS[0]}
          fi
          test -s "${BENCHMARK_JSON_OUTPUT}" || {
            printf '{"status":"failed-before-json","exit_code":%s}\n' "$status" \
              > artifacts/benchmark/failure.json
          }
          exit "$status"

      - name: Save bootstrap benchmark baseline cache
        if: steps.benchmark-baseline.outputs.mode == 'bootstrap'
        uses: actions/cache/save@v6
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.name }}-${{ runner.os }}-py311-${{ hashFiles('uv.lock') }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload benchmark compare artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-compare-artifacts
          path: |
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/benchmark-compare.log
            artifacts/benchmark/benchmark-junit.xml
            artifacts/benchmark/io-benchmark.json
            artifacts/benchmark/io-benchmark-junit.xml
            artifacts/benchmark/io-benchmark-compare.log
            artifacts/benchmark/baseline-metadata.json
            artifacts/benchmark/failure.json
            .benchmarks/
          if-no-files-found: warn
          retention-days: 14

  frontend-node-compatibility:
    name: Frontend Node ${{ matrix.node }} compatibility (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up compatibility Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web_ui_react/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web_ui_react
        run: npm ci

      - name: Run critical compatibility tests and production build
        working-directory: web_ui_react
        run: |
          npm run test:critical
          npm run build

  production-compose-validation:
    name: Production Compose runtime validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate production Compose runtime evidence
        run: bash scripts/ci/validate_production_compose.sh

      - name: Publish production Compose diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-compose-diagnostics
          path: artifacts/production-compose/
          if-no-files-found: warn
          retention-days: 14

  production-readiness:
    name: Production readiness aggregate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    runs-on: ubuntu-latest
    needs: [test, benchmark-compare, gpu-inference-policy-gate, production-profile-dry-run, production-compose-validation]

    steps:
      - name: Confirm production readiness gates
        run: |
          echo "Base quality, benchmark, GPU evidence, production-minimal imports/migration, and Production Compose runtime gates passed."
          echo "Production readiness includes production Compose boot, health/readiness, migration head, restart, persistence, and graceful shutdown evidence."

  production-profile-dry-run:
    name: Production-minimal runtime validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Validate production-minimal installer sync
        run: |
          mkdir -p artifacts/production-minimal
          SIDAR_DEPENDENCY_PROFILE=production-minimal \
            ./install_sidar.sh sync-deps --skip-models --skip-smoke-test --ci --no-interaction \
            2>&1 | tee artifacts/production-minimal/installer-sync.log

      - name: Run production-minimal web boot smoke
        run: |
          uv run --no-sync python - <<'PY' 2>&1 | tee artifacts/production-minimal/web-boot-smoke.log
          from web.app_factory import create_app

          app = create_app(register_handlers=False)
          routes = [route.path for route in app.routes]
          assert "/docs" in routes
          print({"profile": "production-minimal", "web_boot": "ok", "routes": len(routes)})
          PY

      - name: Run production-minimal DB migration smoke
        env:
          DATABASE_URL: sqlite+aiosqlite:///./artifacts/production-minimal/migration-smoke.db
        run: |
          uv run --no-sync alembic upgrade head 2>&1 | tee artifacts/production-minimal/db-migration-smoke.log

      - name: Write production-minimal runtime evidence
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact_dir = Path("artifacts/production-minimal")
          artifact_dir.mkdir(parents=True, exist_ok=True)
          logs = {
              "installer_sync": artifact_dir / "installer-sync.log",
              "web_boot_smoke": artifact_dir / "web-boot-smoke.log",
              "db_migration_smoke": artifact_dir / "db-migration-smoke.log",
          }
          evidence = {
              "schema_version": 1,
              "profile": "production-minimal",
              "release_blocking": True,
              "checks": {
                  name: {"log": str(path), "present": path.exists(), "bytes": path.stat().st_size if path.exists() else 0}
                  for name, path in logs.items()
              },
          }
          (artifact_dir / "runtime-evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload production-minimal runtime evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: production-minimal-runtime-evidence
          path: |
            artifacts/production-minimal/installer-sync.log
            artifacts/production-minimal/web-boot-smoke.log
            artifacts/production-minimal/db-migration-smoke.log
            artifacts/production-minimal/runtime-evidence.json
          if-no-files-found: error
          retention-days: 30

  pg-stress:
    name: PostgreSQL Connection Pool Stress Test
    runs-on: ubuntu-latest
    needs: production-readiness

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar_test
          POSTGRES_DB: sidar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sidar:sidar_test@localhost:5432/sidar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run DB schema migration
        run: uv run alembic upgrade head

      - name: Run PostgreSQL connection pool stress tests
        run: |
          uv run pytest -v -m pg_stress tests/integration/db/ \
            --timeout=120 \
            -x

  gpu-inference-quality-gate:
    name: GPU Inference Quality Gate (TTFT<=200ms, latency<=250ms)
    if: ${{ vars.ENABLE_GPU_BENCH_GATE == 'true' }}
    # `runs-on` is the scheduler contract. Merely exporting the same strings in
    # an environment variable would not make a host eligible for this job.
    runs-on: [self-hosted, linux, x64, gpu, cuda]
    # Primary ve warm-standby aynı etiketleri taşır; GitHub uygun online hostu seçer.
    # Kapasite/RTO sözleşmesi: docs/runbooks/gpu-runner-continuity.md
    # Bounds execution after a runner accepts the job. GitHub does not apply
    # timeout-minutes while a self-hosted job is still queued/offline; the
    # operator runbook documents that separate availability failure mode.
    timeout-minutes: 45
    needs: test

    env:
      GPU_BENCH_TTFT_BUDGET: "0.2"
      GPU_BENCH_LATENCY_BUDGET: "0.25"
      RUN_GPU_STRESS: "1"
      # sidar[runtime-gpu] pulls multi-hundred-MB nvidia-*/torch wheels; uv's
      # 30s default HTTP timeout can time out these individual downloads on a
      # slower/self-hosted link well before the transfer itself would fail.
      UV_HTTP_TIMEOUT: "180"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run GPU inference benchmark quality gate
        run: bash scripts/ci/run_ttft_quality_gate.sh

      - name: Upload GPU inference gate JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gpu-inference-quality-gate-junit
          path: gpu-inference-quality-gate.junit.xml
          if-no-files-found: warn
          retention-days: 14

  gpu-inference-policy-gate:
    name: GPU Inference Required Evidence Gate
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline) }}
    runs-on: ubuntu-latest
    needs: [test, gpu-inference-quality-gate]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Require GPU latency evidence
        env:
          GPU_GATE_ENABLED: ${{ vars.ENABLE_GPU_BENCH_GATE }}
          GPU_GATE_RESULT: ${{ needs.gpu-inference-quality-gate.result }}
        run: bash scripts/ci/check_gpu_evidence.sh

  publish-standalone-installer:
    name: Publish Standalone Installer Bundle
    runs-on: ubuntu-latest
    # Keep installer prerelease publishing tied to installer-specific gates.
    # Heavy runtime gates (production-readiness/pg-stress) remain required for
    # merge confidence, but should not block the standalone installer snapshot
    # when installer manifest/smoke checks are already green.
    needs: [installer-smoke]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # check-pin needs the full history to `git show` the commit pinned
          # in SIDAR_INSTALLER_EMBEDDED_SOURCE_COMMIT; shallow clones don't have it.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.15'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.12.0"
          enable-cache: false

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify install manifest and pinned module commit integrity before bundling
        run: |
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check-pin

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_VERSION_PROBE_ONLY=1 bash dist/install_sidar.sh

      - name: Smoke verify bundled installer integrity
        run: |
          uv run pytest -q --no-cov tests/smoke/test_install_verification.py::test_bundled_install_sidar_manifest_matches

      - name: Publish standalone installer to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'installer-main' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Sidar {0}', github.ref_name) || 'Sidar main installer snapshot' }}
          body: |
            Standalone Sidar installer bundle.

            - `v*` tags publish immutable release assets.
            - `main` pushes update this prerelease snapshot so users do not need the raw GitHub installer URL for clean installs.
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          overwrite_files: true
          files: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
            dist/INSTALLER_USAGE.md
