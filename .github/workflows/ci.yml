name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Test-only CI service credentials; production samples/runbooks must not reuse this password.
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar
          POSTGRES_DB: sidar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      AUTO_DOCKER_TEST_SERVICES: "0"
      AUTO_PREPARE_TEST_DB: "0"
      SMOKE_SKIP_EXTERNAL_INFRA: "0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Test-only CI service credentials matching the ephemeral postgres service above.
      POSTGRES_USER: sidar
      POSTGRES_PASSWORD: sidar
      POSTGRES_DB: sidar
      TEST_DATABASE_NAME: sidar_test
      TEST_DATABASE_USER: sidar
      TEST_DATABASE_PASSWORD: sidar
      DATABASE_URL: postgresql+asyncpg://sidar:sidar@localhost:5432/sidar_test
      REDIS_URL: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache uv's wheel/download store so large wheels like pyarrow do not
          # have to be refetched on every run; a missed cache turns a
          # network/tunnel blip into a CI red. The cache key is derived from
          # uv.lock so a lockfile change naturally invalidates it.
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Restore benchmark baseline cache
        id: benchmark-baseline-cache
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-
            benchmark-baseline-${{ runner.os }}-py311-main-
            benchmark-baseline-${{ runner.os }}-py311-master-
            benchmark-baseline-${{ runner.os }}-py311-

      - name: Resolve benchmark baseline gate mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmarks
          benchmark_compare_name="${BENCHMARK_COMPARE_NAME:-baseline}"
          if find .benchmarks -type f -name "*_${benchmark_compare_name}.json" -print -quit | grep -q .; then
            echo "BENCHMARK_COMPARE_REQUIRED=1" >> "$GITHUB_ENV"
            echo "::notice title=Benchmark baseline::Restored benchmark baseline for ${benchmark_compare_name}; compare gate is required."
            {
              echo "### Benchmark baseline"
              echo "- Restored cached baseline for \`${benchmark_compare_name}\`; compare gate is required."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BENCHMARK_COMPARE_REQUIRED=0" >> "$GITHUB_ENV"
            echo "::notice title=Benchmark baseline::No cached benchmark baseline found for ${benchmark_compare_name}; this run seeds a baseline artifact/cache candidate."
            {
              echo "### Benchmark baseline"
              echo "- No cached baseline found for \`${benchmark_compare_name}\`; this run seeds a reviewable baseline artifact/cache candidate."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose environment (always)
        if: always()
        run: |
          echo "=== uv ===" && uv --version || echo "uv not found"
          echo "=== venv ===" && ls .venv/bin/python3 2>/dev/null || echo "venv missing"
          echo "=== portaudio ===" && dpkg -l portaudio19-dev 2>/dev/null || echo "portaudio not installed"
          echo "=== shellcheck ===" && shellcheck --version 2>/dev/null || echo "shellcheck not found"
          echo "=== bats ===" && bats --version 2>/dev/null || echo "bats not found"

      - name: Verify core install manifest integrity
        run: |
          sha256sum -c .sidar_manifest.txt
          uv run python scripts/tools/update_core_install_manifest.py --check

      - name: Verify installer module hash manifest integrity
        run: |
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check

      - name: Run installer shell gates
        run: |
          make lint
          make test-shell

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh

      - name: Upload standalone installer bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-install-sidar
          path: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_ui_react/package-lock.json

      - name: Run Python lint gate (ruff)
        run: uv run ruff check .

      - name: Run Python format check gate (ruff format)
        run: uv run ruff format --check .

      - name: Run frontend lint gate (eslint)
        run: |
          cd web_ui_react
          npm ci
          npm run lint

      - name: Run frontend dependency audit gate
        env:
          FRONTEND_NPM_AUDIT_LEVEL: high
        run: |
          cd web_ui_react
          npm audit --audit-level="${FRONTEND_NPM_AUDIT_LEVEL}"

      - name: Install Playwright Chromium for frontend smoke tests
        run: |
          cd web_ui_react
          npx playwright install --with-deps chromium

      - name: Run SAST gates (Bandit + pip-audit)
        run: |
          uv run bandit -c pyproject.toml -q -r .
          mkdir -p artifacts/security
          mapfile -t pip_audit_ignore_args < <(python scripts/pip_audit_ignore_args.py)
          stderr_log=artifacts/security/pip-audit-stderr.log
          : > "${stderr_log}"
          if uv run --with pip-audit pip-audit --skip-editable --timeout 30 --format json --output artifacts/security/pip-audit-report.raw.json "${pip_audit_ignore_args[@]}" 2> "${stderr_log}"; then
            exit 0
          fi
          cat "${stderr_log}" >&2 || true
          python scripts/pip_audit_failure_artifact.py artifacts/security/pip-audit-report.raw.json artifacts/security/pip-audit-failure.json --timeout 30 --stderr-log "${stderr_log}"
          failure_category=$(python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.loads(p.read_text(encoding="utf-8")).get("failure_category","unknown"))' artifacts/security/pip-audit-failure.json 2>/dev/null || echo unknown)
          echo "pip-audit failure_category=${failure_category}"
          # CI always treats failures as hard errors; the classification lands
          # in the uploaded artifact so reviewers can tell a network blip from
          # a real CVE without reading the raw stderr.
          exit 1

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-artifacts
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect repository metrics
        run: bash scripts/collect_repo_metrics.sh

      - name: Audit source line metrics (standardized)
        run: |
          bash scripts/audit_metrics.sh . markdown
          bash scripts/audit_metrics.sh . json

      - name: Check empty test artifacts
        run: bash scripts/check_empty_test_artifacts.sh

      - name: Run deterministic quality gates
        run: >-
          uv run pytest -q --no-cov -m quality_gate
          tests/quality/test_llm_quality_gate.py
          tests/quality/test_shellcheck_quality_gate.py

      - name: Run installer/runtime smoke verification tests
        run: >-
          uv run pytest -q --no-cov
          tests/smoke/test_install_verification.py
          tests/smoke/test_repo_phase_dark_mode_assets.py

      - name: Run ShellCheck for installer and install modules
        run: |
          shopt -s globstar nullglob
          uv run shellcheck --severity=warning -x install_sidar.sh scripts/install_modules/**/*.sh

      - name: Prepare isolated test database (sidar_test) + Alembic upgrade
        env:
          PGPASSWORD: sidar
        run: |
          psql -h localhost -U sidar -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sidar_test WITH (FORCE);" \
            -c "CREATE DATABASE sidar_test;" \
            -c "GRANT ALL PRIVILEGES ON DATABASE sidar_test TO sidar;"
          uv run alembic upgrade head

      - name: Run test suite (single pass + coverage gate)
        env:
          RUN_BENCHMARKS: "required"
          RUN_FRONTEND_E2E: "1"
          FRONTEND_E2E_NPM_SCRIPT: "test:e2e:smoke"
          FRONTEND_E2E_ENFORCE_RESULT: "1"
          AUTO_BUILD_DOCKER_TEST_IMAGE: "1"
          DOCKER_TEST_IMAGE: "sidar:latest"
          DOCKER_TEST_IMAGE_BUILD_CONTEXT: "."
          # CI applies a stricter pre-merge coverage gate than the daily local
          # baseline in .coveragerc — see AGENTS.md §2.5.4.
          COVERAGE_FAIL_UNDER_CI: "95"
          BENCHMARK_JSON_OUTPUT: "artifacts/benchmark/benchmark.json"
          BENCHMARK_TREND_COMPARE: "1"
          BENCHMARK_TREND_HISTORY: "artifacts/benchmark/history.json"
          BENCHMARK_TREND_WINDOW: "15"
          BENCHMARK_ENFORCE_COMPARE: "1"
          BENCHMARK_COMPARE_FAIL: "mean:10%"
          BENCHMARK_TREND_MAX_REGRESSION_PCT: "20"
        run: |
          set -o pipefail
          mkdir -p artifacts
          uv run bash run_tests.sh 2>&1 | tee artifacts/test_run.log

      - name: Upload run_tests.sh full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: artifacts/test_run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mypy failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-error-logs
          path: artifacts/mypy_errors*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print last 300 lines of test_run.log on failure
        if: failure()
        run: tail -n 300 artifacts/test_run.log || true

      - name: Upload Playwright frontend smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            web_ui_react/playwright-report/
            web_ui_react/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload BATS JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-junit-report
          path: artifacts/bats/report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Coverage XML + Benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-trend-artifacts
          path: |
            coverage.xml
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/history.json
            .benchmarks/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            web_ui_react/coverage/
            web_ui_react/coverage/lcov-report/
            web_ui_react/coverage/lcov.info
            web_ui_react/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check .env.example ↔ config.py parity
        run: bash scripts/check_env_parity.sh

  installer-smoke:
    # Branch protection should mark this job name as required. It runs on every
    # PR/push so installer drift cannot merge unnoticed when any of these
    # release-critical paths change: install_sidar.sh, .sidar_manifest.txt,
    # core/memory.py, core/multimodal.py, scripts/install_modules/**,
    # scripts/sync_install_manifest.sh, scripts/tools/update_core_install_manifest.py,
    # scripts/tools/update_install_module_hash_manifest.py.
    name: Installer manifest and smoke gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Required embedded manifest sync test
        run: >-
          uv run pytest -q --no-cov
          tests/smoke/test_install_verification.py::test_install_sidar_embedded_manifests_in_sync

      - name: Verify installer manifests directly
        run: |
          sha256sum -c .sidar_manifest.txt
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check

      - name: Treat raw GitHub installer as release artifact
        run: |
          bash -n install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_ABORT_AFTER_HASH_VERIFY=1 bash install_sidar.sh

      - name: Run installer smoke suite
        run: >-
          uv run pytest -q --no-cov
          tests/smoke/test_install_verification.py

  production-profile-dry-run:
    name: Production dependency profile dry run (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Dry-run production dependency profile
        run: uv sync --frozen --extra production

  pg-stress:
    name: PostgreSQL Connection Pool Stress Test
    runs-on: ubuntu-latest
    needs: test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar_test
          POSTGRES_DB: sidar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sidar:sidar_test@localhost:5432/sidar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run DB schema migration
        run: uv run alembic upgrade head

      - name: Run PostgreSQL connection pool stress tests
        run: |
          uv run pytest -v -m pg_stress tests/integration/db/ \
            --timeout=120 \
            -x

  gpu-inference-quality-gate:
    name: GPU Inference Quality Gate (TTFT<=200ms, latency<=250ms)
    if: ${{ vars.ENABLE_GPU_BENCH_GATE == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    needs: test

    env:
      GPU_BENCH_TTFT_BUDGET: "0.2"
      GPU_BENCH_LATENCY_BUDGET: "0.25"
      RUN_GPU_STRESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run GPU inference benchmark quality gate
        run: bash scripts/ci/run_ttft_quality_gate.sh

      - name: Upload GPU inference gate JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-inference-quality-gate-junit
          path: gpu-inference-quality-gate.junit.xml
          if-no-files-found: warn
          retention-days: 14

  publish-standalone-installer:
    name: Publish Standalone Installer Bundle
    runs-on: ubuntu-latest
    needs: [test, pg-stress]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify install manifest integrity before bundling
        run: |
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh

      - name: Smoke verify bundled installer integrity
        run: |
          uv run pytest -q --no-cov tests/smoke/test_install_verification.py::test_bundled_install_sidar_manifest_matches

      - name: Publish standalone installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
