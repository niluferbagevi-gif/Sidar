name: CI

on:
  push:
    branches: ["main", "master"]
    tags:
      - "v*"
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      seed_benchmark_baseline:
        description: "Seed .benchmarks baseline cache/artifact without running the fail-closed production-readiness gate"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed-benchmark-baseline:
    name: Seed benchmark baseline cache
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_benchmark_baseline }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Restore existing benchmark baseline cache (if any)
        uses: actions/cache/restore@v4
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-
            benchmark-baseline-${{ runner.os }}-py311-main-
            benchmark-baseline-${{ runner.os }}-py311-master-
            benchmark-baseline-${{ runner.os }}-py311-

      - name: Seed benchmark baseline
        env:
          DOTENV_FILE: .env.test
          BENCHMARK_BASELINE_NAME: baseline
          BENCHMARK_JSON_OUTPUT: artifacts/benchmark/benchmark.json
        run: |
          set -euo pipefail
          mkdir -p artifacts/benchmark .benchmarks
          uv run python -m pytest -c pyproject.toml -v tests/performance -n 0 --no-cov \
            --benchmark-save="${BENCHMARK_BASELINE_NAME}" \
            --benchmark-json="${BENCHMARK_JSON_OUTPUT}" \
            --benchmark-warmup=on \
            --benchmark-warmup-iterations=100000 \
            --benchmark-disable-gc
          benchmark_compare_name="${BENCHMARK_BASELINE_NAME}"
          if ! find .benchmarks -type f -name "*_${benchmark_compare_name}.json" -print -quit | grep -q .; then
            echo "::error title=Benchmark seed failed::pytest-benchmark completed but .benchmarks/*_${benchmark_compare_name}.json was not created."
            exit 1
          fi
          mapfile -t baseline_files < <(find .benchmarks -type f -name "*_${benchmark_compare_name}.json" | sort)
          BASELINE_FILES="$(printf '%s\n' "${baseline_files[@]}")" python - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline_files = os.environ["BASELINE_FILES"].splitlines()
          manifest = {
              "schema_version": 1,
              "baseline_name": os.environ["BENCHMARK_BASELINE_NAME"],
              "github_run_id": os.environ["GITHUB_RUN_ID"],
              "github_ref": os.environ["GITHUB_REF"],
              "github_sha": os.environ["GITHUB_SHA"],
              "benchmark_files": baseline_files,
          }
          Path("artifacts/benchmark/baseline-seed-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          {
            echo "### Benchmark baseline seeded"
            echo "- Baseline name: \`${benchmark_compare_name}\`"
            echo "- Baseline files: \`${#baseline_files[@]}\`"
            echo "- Seed manifest: \`artifacts/benchmark/baseline-seed-manifest.json\`"
            echo "- Cache key prefix: \`benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-\`"
            echo "- Download artifact: \`benchmark-baseline-seed\` and restore its \`.benchmarks/\` directory if cache restore is unavailable."
            echo "- Next step: rerun the normal CI / production-readiness gate; gated runs remain fail-closed and do not seed baselines."
            echo "- Operator path: GitHub Actions → CI → Run workflow → \`seed_benchmark_baseline=true\`, then rerun normal CI / production-readiness."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark baseline seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline-seed
          path: |
            .benchmarks/
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/baseline-seed-manifest.json
          if-no-files-found: error
          retention-days: 90

      - name: Save benchmark baseline cache for CI
        uses: actions/cache/save@v4
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}

  test:
    name: Base quality gates (lint, smoke, unit, coverage, frontend)
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Test-only CI service credentials; production samples/runbooks must not reuse this password.
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar
          POSTGRES_DB: sidar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 5s

    env:
      AUTO_DOCKER_TEST_SERVICES: "0"
      AUTO_PREPARE_TEST_DB: "0"
      SMOKE_SKIP_EXTERNAL_INFRA: "0"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Test-only CI service credentials matching the ephemeral postgres service above.
      POSTGRES_USER: sidar
      POSTGRES_PASSWORD: sidar
      POSTGRES_DB: sidar
      TEST_DATABASE_NAME: sidar_test
      TEST_DATABASE_USER: sidar
      TEST_DATABASE_PASSWORD: sidar
      DATABASE_URL: postgresql+asyncpg://sidar:sidar@localhost:5432/sidar_test
      REDIS_URL: redis://localhost:6379/0
      # CI production-readiness is a quality gate, not an app production runtime.
      # Keep runtime config in the isolated test profile so weak ephemeral
      # service credentials above cannot satisfy or mask production-secret tests.
      SIDAR_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          # Cache uv's wheel/download store so large wheels like pyarrow do not
          # have to be refetched on every run; a missed cache turns a
          # network/tunnel blip into a CI red. The cache key is derived from
          # uv.lock so a lockfile change naturally invalidates it.
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Check release version consistency
        run: uv run python scripts/check_release_version_consistency.py

      - name: Check dated policy/debt expirations
        run: uv run python scripts/ci/check_policy_dates.py

      - name: Restore benchmark baseline cache
        id: benchmark-baseline-cache
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-
            benchmark-baseline-${{ runner.os }}-py311-main-
            benchmark-baseline-${{ runner.os }}-py311-master-
            benchmark-baseline-${{ runner.os }}-py311-

      - name: Report benchmark baseline availability
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmarks
          benchmark_compare_name="${BENCHMARK_COMPARE_NAME:-baseline}"
          if find .benchmarks -type f -name "*_${benchmark_compare_name}.json" -print -quit | grep -q .; then
            echo "BENCHMARK_BASELINE_AVAILABLE=1" >> "$GITHUB_ENV"
            echo "::notice title=Benchmark baseline::Restored benchmark baseline for ${benchmark_compare_name}; benchmark-compare job will enforce it."
            {
              echo "### Benchmark baseline"
              echo "- Restored cached baseline for \`${benchmark_compare_name}\`; benchmark-compare job will enforce it."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "BENCHMARK_BASELINE_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning title=Benchmark baseline missing::No cached benchmark baseline found for ${benchmark_compare_name}. Base lint/smoke/unit/coverage/frontend gates will still run; benchmark-compare remains fail-closed."
            {
              echo "### Benchmark baseline"
              echo "- No cached baseline found for \`${benchmark_compare_name}\`; base quality gates continue so lint, smoke, unit, coverage, shell and frontend failures remain visible."
              echo "- The separate \`benchmark-compare\` job is fail-closed and blocks production readiness until a reviewed baseline exists."
              echo "- Seed via GitHub Actions → CI → Run workflow → \`seed_benchmark_baseline=true\`, then rerun normal CI / production-readiness."
              echo "- Or restore \`.benchmarks/*_${benchmark_compare_name}.json\` from a reviewed benchmark artifact/cache before re-running CI."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Diagnose environment (always)
        if: always()
        run: |
          echo "=== uv ===" && uv --version || echo "uv not found"
          echo "=== venv ===" && ls .venv/bin/python3 2>/dev/null || echo "venv missing"
          echo "=== portaudio ===" && dpkg -l portaudio19-dev 2>/dev/null || echo "portaudio not installed"
          echo "=== shellcheck ===" && shellcheck --version 2>/dev/null || echo "shellcheck not found"
          echo "=== bats ===" && bats --version 2>/dev/null || echo "bats not found"

      - name: Verify installer manifests
        run: make check-install-manifests

      - name: Run installer ShellCheck
        run: make lint-shell

      - name: Run installer BATS tests
        run: make test-shell

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_VERSION_PROBE_ONLY=1 bash dist/install_sidar.sh

      - name: Upload standalone installer bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-install-sidar
          path: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
            dist/INSTALLER_USAGE.md
          if-no-files-found: error
          retention-days: 30

      - name: Set up Node.js (with npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web_ui_react/package-lock.json

      - name: Run Python lint gate (ruff)
        run: uv run ruff check .

      - name: Run Python format check gate (ruff format)
        run: uv run ruff format --check .

      - name: Run frontend lint gate (eslint)
        run: |
          cd web_ui_react
          npm ci
          npm run lint

      - name: Run frontend type-check gate (tsc)
        run: |
          cd web_ui_react
          npm run typecheck

      - name: Run frontend dependency audit gate
        env:
          FRONTEND_NPM_AUDIT_LEVEL: high
          FRONTEND_NPM_AUDIT_ALLOW_NETWORK_FAILURE: "0"
        run: |
          cd web_ui_react
          npm run audit:high

      - name: Install Playwright Chromium for frontend smoke tests
        run: |
          cd web_ui_react
          npx playwright install --with-deps chromium

      - name: Run SAST gates (Bandit + pip-audit)
        run: |
          uv run bandit -r . -c pyproject.toml
          mkdir -p artifacts/security
          mapfile -t pip_audit_ignore_args < <(python scripts/pip_audit_ignore_args.py)
          stderr_log=artifacts/security/pip-audit-stderr.log
          : > "${stderr_log}"
          if uv run --with pip-audit pip-audit --skip-editable --timeout 30 --format json --output artifacts/security/pip-audit-report.raw.json "${pip_audit_ignore_args[@]}" 2> "${stderr_log}"; then
            exit 0
          fi
          cat "${stderr_log}" >&2 || true
          python scripts/pip_audit_failure_artifact.py artifacts/security/pip-audit-report.raw.json artifacts/security/pip-audit-failure.json --timeout 30 --stderr-log "${stderr_log}"
          failure_category=$(python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); print(json.loads(p.read_text(encoding="utf-8")).get("failure_category","unknown"))' artifacts/security/pip-audit-failure.json 2>/dev/null || echo unknown)
          echo "pip-audit failure_category=${failure_category}"
          # CI always treats failures as hard errors; the classification lands
          # in the uploaded artifact so reviewers can tell a network blip from
          # a real CVE without reading the raw stderr.
          exit 1

      - name: Upload security audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-artifacts
          path: artifacts/security/
          if-no-files-found: warn
          retention-days: 14

      - name: Collect repository metrics
        run: bash scripts/collect_repo_metrics.sh

      - name: Audit source line metrics (standardized)
        run: |
          bash scripts/audit_metrics.sh . markdown
          bash scripts/audit_metrics.sh . json

      - name: Check empty test artifacts
        run: bash scripts/check_empty_test_artifacts.sh

      - name: Run deterministic quality gates
        run: >-
          uv run pytest -q --no-cov -m quality_gate
          tests/quality/test_llm_quality_gate.py
          tests/quality/test_shellcheck_quality_gate.py

      # Must run before any smoke/test step below: tests/smoke/test_boot.py
      # connects to the sidar_test database, so it has to exist first.
      - name: Prepare isolated test database (sidar_test) + Alembic upgrade
        env:
          PGPASSWORD: sidar
        run: |
          psql -h localhost -U sidar -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS sidar_test WITH (FORCE);" \
            -c "CREATE DATABASE sidar_test;" \
            -c "GRANT ALL PRIVILEGES ON DATABASE sidar_test TO sidar;"
          uv run alembic upgrade head

      - name: Run critical smoke import gates with exit-first
        run: >-
          uv run pytest -q -x --no-cov
          tests/smoke/test_boot.py
          tests/smoke/test_imports.py

      - name: Run installer/runtime smoke verification tests
        run: >-
          uv run pytest -q --no-cov -m installer_smoke

      - name: Run ShellCheck for installer and install modules
        run: |
          shopt -s globstar nullglob
          uv run shellcheck --severity=warning -x install_sidar.sh scripts/install_modules/**/*.sh

      - name: Run canonical production-readiness gate
        env:
          FRONTEND_E2E_NPM_SCRIPT: "test:e2e:smoke"
          RUN_FRONTEND_E2E: "1"
          FRONTEND_E2E_ENFORCE_RESULT: "1"
          QUALITY_GATE_EXIT_AFTER_FIRST_FAIL: "1"
          AUTO_BUILD_DOCKER_TEST_IMAGE: "1"
          DOCKER_TEST_IMAGE: "sidar:latest"
          DOCKER_TEST_IMAGE_BUILD_CONTEXT: "."
          # CI no longer hardcodes a separate pre-merge override; it inherits
          # the ratchet-managed pyproject.toml baseline like the local profile
          # (current local/CI baseline: %99; coverage_ratchet.py only raises it)
          # — see AGENTS.md §2.5.4. Set COVERAGE_FAIL_UNDER_CI explicitly if a
          # stricter ad-hoc pre-merge bar is ever needed again.
        run: |
          set -o pipefail
          mkdir -p artifacts
          make production-readiness 2>&1 | tee artifacts/test_run.log

      - name: Validate base quality test summary
        run: uv run python scripts/ci/validate_test_summary.py --mode development --summary artifacts/test-summary.json

      - name: Verify committed coverage ratchet baseline
        run: |
          if ! git diff --exit-code -- pyproject.toml; then
            echo "::error::pyproject.toml coverage fail_under changed during run_tests.sh. Commit the ratcheted baseline in a dedicated PR or lower the measured run below the ratchet threshold intentionally."
            exit 1
          fi

      - name: Upload run_tests.sh full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-run-log
          path: artifacts/test_run.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload mypy failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-error-logs
          path: artifacts/mypy_errors*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Print last 300 lines of test_run.log on failure
        if: failure()
        run: tail -n 300 artifacts/test_run.log || true

      - name: Upload Playwright frontend smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-report
          path: |
            web_ui_react/playwright-report/
            web_ui_react/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload BATS JUnit Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bats-junit-report
          path: artifacts/bats/report.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Backend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: htmlcov/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload test summary, coverage XML/JSON + Benchmark JSON artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-quality-trend-artifacts
          path: |
            artifacts/test-summary.json
            coverage.json
            coverage.xml
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/history.json
            .benchmarks/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Frontend Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: |
            web_ui_react/coverage/
            web_ui_react/coverage/lcov-report/
            web_ui_react/coverage/lcov.info
            web_ui_react/coverage/coverage-final.json
          if-no-files-found: warn
          retention-days: 14

      - name: Check .env.example ↔ config.py parity
        run: bash scripts/check_env_parity.sh

  installer-smoke:
    # Branch protection should mark this job name as required. It runs on every
    # PR/push so installer drift cannot merge unnoticed when any of these
    # release-critical paths change: install_sidar.sh, .sidar_manifest.txt,
    # core/memory.py, core/multimodal.py, scripts/install_modules/**,
    # scripts/sync_install_manifest.sh, scripts/tools/update_core_install_manifest.py,
    # scripts/tools/update_install_module_hash_manifest.py.
    name: Installer manifest and smoke gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install test dependencies
        run: uv sync --frozen --extra dev

      - name: Required installer manifest drift gate
        run: make check-install-manifests

      - name: Required installer ShellCheck gate
        run: make installer-shellcheck

      - name: Required embedded manifest sync test
        run: >-
          uv run pytest -q --no-cov
          tests/smoke/test_install_verification.py::test_install_sidar_embedded_manifests_in_sync

      - name: Verify installer manifests directly
        run: |
          sha256sum -c .sidar_manifest.txt
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check

      - name: Treat raw GitHub installer as release artifact
        run: |
          bash -n install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_ABORT_AFTER_HASH_VERIFY=1 bash install_sidar.sh

      - name: Verify installer smoke isolation from user secrets
        run: |
          set -euo pipefail
          test_home="$(mktemp -d)"
          printf 'OPENAI_API_KEY=%0200000d\n' 0 > "$test_home/.sidar_keys.env"

          HOME="$test_home" \
          SIDAR_KEYS_FILE="$test_home/.sidar_keys.env" \
          SIDAR_TEST_LOAD_REAL_KEYS=0 \
          uv run pytest \
            -q --no-cov -p no:xdist -x \
            --confcutdir=tests/smoke \
            tests/smoke/test_install_verification.py

      - name: Run installer smoke suite
        run: >-
          uv run pytest -q --no-cov -m installer_smoke

  benchmark-compare:
    name: Benchmark compare gate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Restore benchmark baseline cache
        id: benchmark-baseline-cache
        uses: actions/cache@v4
        with:
          path: .benchmarks
          key: benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            benchmark-baseline-${{ runner.os }}-py311-${{ github.ref_name }}-
            benchmark-baseline-${{ runner.os }}-py311-main-
            benchmark-baseline-${{ runner.os }}-py311-master-
            benchmark-baseline-${{ runner.os }}-py311-

      - name: Resolve benchmark baseline gate mode
        id: benchmark-baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .benchmarks artifacts/benchmark
          benchmark_compare_name="${BENCHMARK_COMPARE_NAME:-baseline}"
          compare_file="$(find .benchmarks -type f -name "*_${benchmark_compare_name}.json" -print 2>/dev/null | sort -V | tail -n 1)"
          if [[ -z "$compare_file" ]]; then
            echo "::error title=Benchmark baseline missing::No cached benchmark baseline found for ${benchmark_compare_name}. Base quality gates run separately, but production readiness is fail-closed until a benchmark baseline exists."
            {
              echo "### Benchmark baseline"
              echo "- No cached baseline found for \`${benchmark_compare_name}\`; benchmark compare is fail-closed."
              echo "- Base quality gates are independent and still run in the \`test\` job."
              echo "- Seed via GitHub Actions → CI → Run workflow → \`seed_benchmark_baseline=true\`, then rerun normal CI / production-readiness."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "compare_file=$compare_file" >> "$GITHUB_OUTPUT"
          echo "::notice title=Benchmark baseline::Using ${compare_file} for compare gate."

      - name: Run benchmark compare gate
        env:
          DOTENV_FILE: .env.test
          BENCHMARK_JSON_OUTPUT: artifacts/benchmark/benchmark.json
          BENCHMARK_COMPARE_FAIL: mean:10%
          BENCHMARK_BASELINE_FILE: ${{ steps.benchmark-baseline.outputs.compare_file }}
        run: |
          set -o pipefail
          mkdir -p artifacts/benchmark
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          baseline = Path(os.environ["BENCHMARK_BASELINE_FILE"])
          metadata = {
              "baseline_file": str(baseline),
              "baseline_exists": baseline.exists(),
              "baseline_size_bytes": baseline.stat().st_size if baseline.exists() else 0,
          }
          Path("artifacts/benchmark/baseline-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True),
              encoding="utf-8",
          )
          PY
          uv run python -m pytest -c pyproject.toml -v tests/performance -n 0 --no-cov \
            --benchmark-json="${BENCHMARK_JSON_OUTPUT}" \
            --benchmark-compare="${BENCHMARK_BASELINE_FILE}" \
            --benchmark-compare-fail="${BENCHMARK_COMPARE_FAIL}" \
            --benchmark-warmup=on \
            --benchmark-warmup-iterations=100000 \
            --benchmark-disable-gc \
            --junitxml=artifacts/benchmark/benchmark-junit.xml \
            2>&1 | tee artifacts/benchmark/benchmark-compare.log
          status=${PIPESTATUS[0]}
          test -s "${BENCHMARK_JSON_OUTPUT}" || {
            printf '{"status":"failed-before-json","exit_code":%s}\n' "$status" \
              > artifacts/benchmark/failure.json
          }
          exit "$status"

      - name: Upload benchmark compare artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-compare-artifacts
          path: |
            artifacts/benchmark/benchmark.json
            artifacts/benchmark/benchmark-compare.log
            artifacts/benchmark/benchmark-junit.xml
            artifacts/benchmark/baseline-metadata.json
            artifacts/benchmark/failure.json
            .benchmarks/
          if-no-files-found: warn
          retention-days: 14

  production-readiness:
    name: Production readiness aggregate
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.seed_benchmark_baseline }}
    runs-on: ubuntu-latest
    needs: [test, benchmark-compare]

    steps:
      - name: Confirm production readiness gates
        run: |
          echo "Base quality gates and benchmark compare gate passed."
          echo "Production readiness is the combined result of jobs: test + benchmark-compare."

  production-profile-dry-run:
    name: Production dependency profile dry run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Dry-run production-minimal dependency profile
        run: |
          uv sync --frozen --extra production-minimal --no-dev
          uv run --no-sync python -c "import fastapi, sqlalchemy, alembic; print('production-minimal imports ok')"

  pg-stress:
    name: PostgreSQL Connection Pool Stress Test
    runs-on: ubuntu-latest
    needs: production-readiness

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sidar
          POSTGRES_PASSWORD: sidar_test
          POSTGRES_DB: sidar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sidar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://sidar:sidar_test@localhost:5432/sidar_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: |
          uv sync --frozen --all-extras

      - name: Run DB schema migration
        run: uv run alembic upgrade head

      - name: Run PostgreSQL connection pool stress tests
        run: |
          uv run pytest -v -m pg_stress tests/integration/db/ \
            --timeout=120 \
            -x

  gpu-inference-quality-gate:
    name: GPU Inference Quality Gate (TTFT<=200ms, latency<=250ms)
    if: ${{ vars.ENABLE_GPU_BENCH_GATE == 'true' }}
    runs-on: [self-hosted, linux, gpu]
    needs: test

    env:
      GPU_BENCH_TTFT_BUDGET: "0.2"
      GPU_BENCH_LATENCY_BUDGET: "0.25"
      RUN_GPU_STRESS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run GPU inference benchmark quality gate
        run: bash scripts/ci/run_ttft_quality_gate.sh

      - name: Upload GPU inference gate JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-inference-quality-gate-junit
          path: gpu-inference-quality-gate.junit.xml
          if-no-files-found: warn
          retention-days: 14

  publish-standalone-installer:
    name: Publish Standalone Installer Bundle
    runs-on: ubuntu-latest
    needs: [production-readiness, pg-stress]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Cache APT packages (PortAudio)
        uses: awalsh128/cache-apt-pkgs-action@v1.4.3
        with:
          packages: portaudio19-dev
          version: ci-portaudio-v1

      - name: Install system dependencies
        run: bash scripts/install_ci_system_deps.sh

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Verify install manifest integrity before bundling
        run: |
          uv run python scripts/tools/update_core_install_manifest.py --check
          uv run python scripts/tools/update_install_module_hash_manifest.py --target install_sidar.sh --check

      - name: Build standalone installer bundle
        run: |
          bash scripts/tools/bundle_install_sidar.sh
          bash -n dist/install_sidar.sh
          SIDAR_INSTALL_TEST_MODE=1 SIDAR_INSTALL_VERSION_PROBE_ONLY=1 bash dist/install_sidar.sh

      - name: Smoke verify bundled installer integrity
        run: |
          uv run pytest -q --no-cov tests/smoke/test_install_verification.py::test_bundled_install_sidar_manifest_matches

      - name: Publish standalone installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'installer-main' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Sidar {0}', github.ref_name) || 'Sidar main installer snapshot' }}
          body: |
            Standalone Sidar installer bundle.

            - `v*` tags publish immutable release assets.
            - `main` pushes update this prerelease snapshot so users do not need the raw GitHub installer URL for clean installs.
          prerelease: ${{ github.ref == 'refs/heads/main' }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
          overwrite_files: true
          files: |
            dist/install_sidar.sh
            dist/MODULE_HASHES.txt
            dist/INSTALLER_USAGE.md
