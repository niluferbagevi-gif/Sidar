# GPU profil servisleri: NVIDIA Container Toolkit gerektiren, `profiles: ["gpu"]`
# ile etiketlenmiş servisler. docker-compose.yml (core) ile birlikte -f ile
# birleştirilir; tek başına yeterli değildir (postgres/redis/docker-socket-proxy
# gibi paylaşılan bağımlılıklar core dosyada kalır).
#
# Kullanım:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile gpu up
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-gpu
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-web-gpu
#
# Gereksinim: NVIDIA Container Toolkit kurulu olmalı.
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/install-guide.html
# WSL2 notu: WSL2 üzerinde Docker GPU desteği için önce Windows tarafında
#   NVIDIA Driver (>=595.x) kurulmalı; WSL2 içinde ayrıca nvidia-ctk kurulumu gerekir:
#   sudo apt-get install -y nvidia-container-toolkit && sudo nvidia-ctk runtime configure --runtime=docker

services:
  ollama-gpu:
    profiles: ["gpu"]
    image: ollama/ollama:0.32.14
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_ollama
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-nvidia}
    environment:
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-4}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-30m}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_NUM_BATCH=${OLLAMA_NUM_BATCH:-2048}
    # bkz. docker-compose.yml'deki ollama servisindeki loopback-bind notu (kimlik doğrulaması olmayan API).
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # bkz. docker-compose.yml'deki ollama servisindeki healthcheck notu (curl/wget yok, `ollama list` kullanılır).
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── CLI Modu — GPU (NVIDIA) ────────────────────────────────────
  # Kullanım: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-gpu
  sidar-gpu:
    profiles: ["gpu"]
    image: ${SIDAR_GPU_DOCKER_IMAGE:-sidar-gpu:latest}
    # `image` never resolves against a registry — it only names the locally
    # built tag. Without pull_policy, `docker compose up` tries a registry
    # pull first, fails with a confusing "pull access denied" before falling
    # back to `build:`. Force straight to the local build instead.
    pull_policy: build
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:13.0.0-runtime-ubuntu22.04
        GPU_ENABLED: "true"
        # No TORCH_INDEX_URL: the Dockerfile never declares that ARG, and
        # `uv sync --frozen` installs exactly what uv.lock pins regardless —
        # torch's manylinux wheel already bundles CUDA 13.x runtime deps
        # matching this base image (see pyproject.toml's [tool.uv.sources]
        # comment). A build arg here was previously silently dropped by
        # Docker with no effect; removed rather than wired up as dead noise.
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_agent_gpu
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_GPU_CPU_LIMIT:-4.0}
    mem_limit: ${SIDAR_GPU_MEM_LIMIT:-8g}

    # NVIDIA GPU çalışma zamanı (Docker Compose v2 sözdizimi)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all          # Tüm GPU'ları bağla; belirli sayı için: count: 1
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-gpu:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully
      docker-socket-proxy:
        condition: service_started

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - USE_GPU=true
      - GPU_DEVICE=${GPU_DEVICE:-0}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      - GPU_MIXED_PRECISION=${GPU_MIXED_PRECISION:-true}   # Ampere+ (RTX 30xx/40xx) FP16 destekler; eski GPU için .env'de false yapın
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Ham host socket'i yerine kısıtlı docker-socket-proxy'e bağlan (bkz. servis notu).
      - DOCKER_HOST=tcp://docker-socket-proxy:2375

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"

    stdin_open: true
    tty: true

  # ── Web Arayüzü — GPU ─────────────────────────────────────────
  # Kullanım: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up sidar-web-gpu
  sidar-web-gpu:
    profiles: ["gpu"]
    build:
      context: .
      args:
        BASE_IMAGE: nvidia/cuda:13.0.0-runtime-ubuntu22.04
        GPU_ENABLED: "true"
        # No TORCH_INDEX_URL: the Dockerfile never declares that ARG, and
        # `uv sync --frozen` installs exactly what uv.lock pins regardless —
        # torch's manylinux wheel already bundles CUDA 13.x runtime deps
        # matching this base image (see pyproject.toml's [tool.uv.sources]
        # comment). A build arg here was previously silently dropped by
        # Docker with no effect; removed rather than wired up as dead noise.
    container_name: ${COMPOSE_PROJECT_NAME:-sidar}_web_gpu
    user: "${SIDAR_CONTAINER_UID:-10001}:${SIDAR_CONTAINER_GID:-10001}"
    restart: unless-stopped
    cpus: ${SIDAR_WEB_GPU_CPU_LIMIT:-4.0}
    mem_limit: ${SIDAR_WEB_GPU_MEM_LIMIT:-8g}
    command: --quick web --host 0.0.0.0 --port 7860

    ports:
      - "${WEB_GPU_PORT:-7861}:7860"

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
        limits:
          cpus: '4.0'
          memory: 8G

    # jaeger artık docker-compose.observability.yml'de tanımlı; buradaki
    # soft (required: false) depends_on kaldırıldı — cross-file bir servise
    # referans vermek, o dosya -f ile eklenmediğinde "depends on undefined
    # service" hatası verirdi. Bu yalnızca başlangıç sırası için bir
    # optimizasyondu (ENABLE_TRACING zaten varsayılan false'tur ve jaeger
    # ulaşılamazsa bağlantı hatası zaten gracefully ele alınır), kaldırılması
    # davranışı değiştirmez.
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama-gpu:
        condition: service_healthy
      sidar-migrate:
        condition: service_completed_successfully

    environment:
      - ACCESS_LEVEL=sandbox
      - AI_PROVIDER=${AI_PROVIDER:-ollama}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434/api}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-10}
      - REDIS_MAX_CONNECTIONS=${REDIS_MAX_CONNECTIONS:-100}
      # Dockerfile'ın gömülü REDIS_URL varsayılanını (parolasız) ve .env'deki
      # bare-metal SIDAR_REDIS_URL değerini (host makine adresi) geçersiz
      # kılarak container'ın her zaman parolalı, network-içi redis'e bağlanmasını sağlar.
      - SIDAR_REDIS_URL=redis://:${REDIS_PASSWORD:?Set a strong REDIS_PASSWORD in .env; empty/default passwords are refused}@redis:6379/0
      - WEB_HOST=0.0.0.0
      - WEB_PORT=7860
      - USE_GPU=true
      - GPU_DEVICE=${GPU_DEVICE:-0}
      - GPU_MEMORY_FRACTION=${GPU_MEMORY_FRACTION:-0.8}
      - GPU_MIXED_PRECISION=${GPU_MIXED_PRECISION:-true}   # Ampere+ (RTX 30xx/40xx) FP16 destekler; eski GPU için .env'de false yapın
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - MEMORY_ENCRYPTION_KEY=${MEMORY_ENCRYPTION_KEY:-}
      - API_KEY=${API_KEY:-}
      # config.py'nin (ENABLE_TRACING=False) ve .env.advanced.example'ın kendi
      # belgelenmiş varsayılanıyla eşleşir. `jaeger` yalnızca "observability"
      # profili altında başlar (bkz. docker-compose.observability.yml); bu
      # değişken burada true varsayılansaydı, jaeger'sız her cpu/gpu-profilli
      # compose koşusunda (ör. scripts/ci/validate_production_compose.sh)
      # sidar-web jaeger:4317'ye OTLP export denemeye çalışıp
      # DEADLINE_EXCEEDED ile başarısız olur, işlevsel olmayan ama gürültülü
      # boot log'ları üretirdi.
      - ENABLE_TRACING=${ENABLE_TRACING:-false}
      - OTEL_EXPORTER_ENDPOINT=${OTEL_EXPORTER_ENDPOINT:-http://jaeger:4317}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-sidar-web-gpu}
      - DATABASE_URL=${SIDAR_CONTAINER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-sidar}:${POSTGRES_PASSWORD:?Set a strong POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sidar}}

    env_file:
      - ${SIDAR_RUNTIME_ENV_FILE:-.env}

    volumes:
      - ${SIDAR_DATA_MOUNT:-./data}:/app/data
      - ${SIDAR_LOGS_MOUNT:-./logs}:/app/logs
      - ${SIDAR_TEMP_MOUNT:-./temp}:/app/temp

    extra_hosts:
      - "host.docker.internal:${HOST_GATEWAY:-host-gateway}"
