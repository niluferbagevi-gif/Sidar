{{- if and .Values.postgresql.enabled (not .Values.postgresql.existingSecret.name) }}
{{- $password := required "postgresql.password must be set to a strong value, or postgresql.existingSecret.name must reference a Secret managed outside this chart" .Values.postgresql.password -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sidar.postgresqlSecretName" . }}
  labels:
    app.kubernetes.io/name: {{ include "sidar.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.postgresql.existingSecret.databaseKey }}: {{ .Values.postgresql.database | quote }}
  {{ .Values.postgresql.existingSecret.usernameKey }}: {{ .Values.postgresql.username | quote }}
  {{ .Values.postgresql.existingSecret.passwordKey }}: {{ $password | quote }}
  {{ .Values.postgresql.existingSecret.databaseUrlKey }}: {{ printf "postgresql+asyncpg://%s:%s@%s-postgresql:%v/%s" .Values.postgresql.username $password (include "sidar.fullname" .) .Values.postgresql.port .Values.postgresql.database | quote }}
{{- end }}
