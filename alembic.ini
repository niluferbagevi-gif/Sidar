[alembic]
script_location = migrations
prepend_sys_path = .
# Use OS-native path separator for prepend_sys_path / version_locations entries.
path_separator = os
# Generate migration timestamps in UTC so multi-region teams stay in sync.
timezone = UTC
# Cap slug length to keep migration filenames readable on all filesystems.
truncate_slug_length = 60
# Local development fallback only. Production deployments MUST override this via
# the DATABASE_URL environment variable or `-x database_url=...` on the CLI;
# migrations/env.py already prefers those sources before this default.
sqlalchemy.url = postgresql+asyncpg://sidar:sidar@localhost:5432/sidar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
