[alembic]
script_location = migrations
prepend_sys_path = .
# Local development fallback only. Production/container runs must pass
# DATABASE_URL or -x database_url=...; migrations/env.py refuses this
# default when SIDAR_ENV=production to avoid accidental weak credentials.
sqlalchemy.url = postgresql+asyncpg://sidar:sidar@localhost:5432/sidar

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
